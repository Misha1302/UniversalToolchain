name: Diagnose PlanFuzz surface hardening patch

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-surface-hardening
          fetch-depth: 0

      - name: Reconstruct patch and collect diagnostics
        shell: bash
        run: |
          set +e
          cat .github/planfuzz-surface-hardening-patch/chunk* > "$RUNNER_TEMP/hardening.patch.gz.b64"
          sha256sum "$RUNNER_TEMP/hardening.patch.gz.b64" > "$RUNNER_TEMP/base64-sha.txt"
          base64 --decode "$RUNNER_TEMP/hardening.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/hardening.patch"
          sha256sum "$RUNNER_TEMP/hardening.patch" > "$RUNNER_TEMP/patch-sha.txt"
          patch -p1 --batch --verbose --dry-run < "$RUNNER_TEMP/hardening.patch" > "$RUNNER_TEMP/patch-dry-run.txt" 2>&1
          echo "$?" > "$RUNNER_TEMP/patch-exit-code.txt"
          git status --short > "$RUNNER_TEMP/git-status.txt"
          git diff -- MANIFEST.sha256 > "$RUNNER_TEMP/manifest-diff.txt"
          exit 0

      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: surface-hardening-patch-diagnostics
          path: |
            ${{ runner.temp }}/base64-sha.txt
            ${{ runner.temp }}/patch-sha.txt
            ${{ runner.temp }}/patch-dry-run.txt
            ${{ runner.temp }}/patch-exit-code.txt
            ${{ runner.temp }}/git-status.txt
            ${{ runner.temp }}/manifest-diff.txt
          if-no-files-found: error
          retention-days: 1
