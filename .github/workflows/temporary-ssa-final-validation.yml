name: Temporary SSA final validation

on:
  push:
    branches:
      - fix/ssa-route-execution-contracts-20260715
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate-and-clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ssa-route-execution-contracts-20260715
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Refresh manifest, test, and commit clean result
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow=.github/workflows/temporary-ssa-final-validation.yml
          rm -f "$workflow"
          git add -A

          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import subprocess
          from pathlib import Path

          manifest = Path('MANIFEST.sha256')
          paths = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = os.fsdecode(raw)
              if path == manifest.as_posix():
                  continue
              file_path = Path(path)
              if not file_path.is_file():
                  raise SystemExit(f'Git index contains missing file: {path}')
              paths.append(path)

          lines = []
          for path in sorted(paths):
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}')

          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'MANIFEST.sha256 entries: {len(lines)}')
          PY

          git add MANIFEST.sha256
          sha256sum --check MANIFEST.sha256
          git diff --cached --check

          dotnet test UniversalToolchain/Tests/Tests.csproj \
            -c Release \
            --filter 'FullyQualifiedName~SsaRouteOperationalContractTests' \
            --logger 'console;verbosity=normal'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: verify formatted SSA route regressions'
          git push origin HEAD:fix/ssa-route-execution-contracts-20260715
