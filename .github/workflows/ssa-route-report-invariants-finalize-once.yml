name: Finalize SSA route report invariants once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch report contract, docs, and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          route = pathlib.Path('UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRoundtripRoute.cs')
          lines = route.read_text(encoding='utf-8').splitlines()
          marker = 'throw new ArgumentOutOfRangeException(nameof(outputAirInstructionCount));'
          indices = [index for index, line in enumerate(lines) if line.strip() == marker]
          if len(indices) != 1:
              raise SystemExit(f'Expected one output-count guard, found {len(indices)}')
          insert_at = indices[0] + 1
          sentinel = '        if (usedSsa && fellBackToInput)'
          if sentinel not in lines:
              guards = [
                  '        if (usedSsa && fellBackToInput)',
                  '            throw new ArgumentException("An SSA route cannot both succeed and fall back to its input.");',
                  '        if (policy == SsaRoutePolicy.Off && (usedSsa || fellBackToInput))',
                  '            throw new ArgumentException("A disabled SSA route cannot be reported as used or fallen back.");',
                  '        if (fellBackToInput && policy != SsaRoutePolicy.Prefer)',
                  '            throw new ArgumentException("Only the Prefer SSA policy may fall back to its input.");',
                  '        if (fellBackToInput && outputAirInstructionCount != inputAirInstructionCount)',
                  '        {',
                  '            throw new ArgumentException(',
                  '                "An SSA fallback must preserve the input AIR instruction count.",',
                  '                nameof(outputAirInstructionCount));',
                  '        }',
              ]
              lines[insert_at:insert_at] = guards
              route.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          docs = pathlib.Path('docs/architecture/ssa-coverage-matrix.md')
          text = docs.read_text(encoding='utf-8')
          row = '| Route report state invariants | Enforced | impossible success/fallback/policy/count combinations are rejected by `SsaRouteReportInvariantTests` |'
          if row not in text:
              marker = '| Observability | Supported | `WistOptimizationReport` exposes route, fallback, profile, counts, passes, stage-qualified diagnostics, and trace |'
              if text.count(marker) != 1:
                  raise SystemExit('Expected one observability row')
              text = text.replace(marker, marker + '\n' + row, 1)
              docs.write_text(text, encoding='utf-8')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-route-report-invariants-finalize-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          manifest = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              manifest.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(manifest), encoding='utf-8')
          PY

      - name: Commit finalized integration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRoundtripRoute.cs \
            docs/architecture/ssa-coverage-matrix.md \
            MANIFEST.sha256
          git commit -m "ssa: enforce route report state invariants"
          git push origin "HEAD:${{ github.head_ref }}"
