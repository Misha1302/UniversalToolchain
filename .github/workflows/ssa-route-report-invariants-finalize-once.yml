name: Finalize SSA route report invariants once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch report contract, docs, and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          def replace_once(path, old, new):
              file = pathlib.Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'Expected marker missing in {path}: {old!r}')
              if count != 1:
                  raise SystemExit(f'Expected one marker in {path}, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          route = 'UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRoundtripRoute.cs'
          replace_once(
              route,
              '''        if (outputAirInstructionCount < 0)
                          throw new ArgumentOutOfRangeException(nameof(outputAirInstructionCount));

                      Policy = policy;''',
              '''        if (outputAirInstructionCount < 0)
                          throw new ArgumentOutOfRangeException(nameof(outputAirInstructionCount));
                      if (usedSsa && fellBackToInput)
                          throw new ArgumentException("An SSA route cannot both succeed and fall back to its input.");
                      if (policy == SsaRoutePolicy.Off && (usedSsa || fellBackToInput))
                          throw new ArgumentException("A disabled SSA route cannot be reported as used or fallen back.");
                      if (fellBackToInput && policy != SsaRoutePolicy.Prefer)
                          throw new ArgumentException("Only the Prefer SSA policy may fall back to its input.");
                      if (fellBackToInput && outputAirInstructionCount != inputAirInstructionCount)
                      {
                          throw new ArgumentException(
                              "An SSA fallback must preserve the input AIR instruction count.",
                              nameof(outputAirInstructionCount));
                      }

                      Policy = policy;''')

          docs = 'docs/architecture/ssa-coverage-matrix.md'
          replace_once(
              docs,
              '| Observability | Supported | `WistOptimizationReport` exposes route, fallback, profile, counts, passes, stage-qualified diagnostics, and trace |',
              '| Observability | Supported | `WistOptimizationReport` exposes route, fallback, profile, counts, passes, stage-qualified diagnostics, and trace |\n| Route report state invariants | Enforced | impossible success/fallback/policy/count combinations are rejected by `SsaRouteReportInvariantTests` |')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-route-report-invariants-finalize-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit finalized integration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRoundtripRoute.cs \
            docs/architecture/ssa-coverage-matrix.md \
            MANIFEST.sha256
          git commit -m "ssa: enforce route report state invariants"
          git push origin "HEAD:${{ github.head_ref }}"
