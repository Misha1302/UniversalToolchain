name: Clean publication branch diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - research/publication-readiness-2026-07-30

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: research/publication-readiness-2026-07-30
          fetch-depth: 0

      - name: Remove temporary diagnostics and redundant CLI metadata registration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          program_path = Path("UniversalToolchain/Wistc/Program.cs")
          program = program_path.read_text(encoding="utf-8")
          program = program.replace("using Microsoft.Extensions.DependencyInjection.Extensions;\n", "", 1)
          temporary_block = '''
    // The CLI hosts the two shipped backend descriptions so composition-time semantic
    // planning can observe their intrinsic surface. Runtime activation is still resolved
    // from the exact selected manifest entry; registering this metadata does not activate
    // an unselected backend.
    services.TryAddEnumerable(
        ServiceDescriptor.Singleton<IDialectBackendRuntimeRegistrar, WistCilDialectBackendServiceProvider>());
    services.TryAddEnumerable(
        ServiceDescriptor.Singleton<IDialectBackendRuntimeRegistrar, WistInterpreterDialectBackendServiceProvider>());
'''
          if temporary_block not in program:
              raise SystemExit("temporary CLI metadata block was not found")
          program = program.replace(temporary_block, "", 1)
          program_path.write_text(program, encoding="utf-8", newline="\n")

          workflow_path = Path(".github/workflows/contract-experiment.yml")
          workflow = workflow_path.read_text(encoding="utf-8")
          diagnostic_step = '''
      - name: Diagnose selected SafeMath capability surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p UniversalToolchain/packages
          dotnet run --project UniversalToolchain/Wistc/Wistc.csproj -- \
            features \
            --dialect-file UniversalToolchain/Dialects/examples/wist/function-calls-safe-math/dialect.wistdialect
'''
          if diagnostic_step not in workflow:
              raise SystemExit("temporary workflow diagnostic step was not found")
          workflow = workflow.replace(diagnostic_step, "", 1)
          workflow_path.write_text(workflow, encoding="utf-8", newline="\n")
          PY
          rm .github/workflows/cleanup-publication-branch.yml
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add UniversalToolchain/Wistc/Program.cs \
                  .github/workflows/contract-experiment.yml \
                  .github/workflows/cleanup-publication-branch.yml
          git commit -m "chore: remove publication diagnostics"
          git push origin HEAD:research/publication-readiness-2026-07-30
