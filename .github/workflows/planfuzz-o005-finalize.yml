name: PlanFuzz O-005 final evidence

on:
  pull_request:
    types: [reopened]

jobs:
  finalize:
    if: github.head_ref == 'research/planfuzz-o005-evidence-hardening'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-o005-evidence-hardening
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prepare self-cleaning workspace
        id: prepare
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/planfuzz-o005-finalize.trigger
          reviewed_head="$(git rev-parse HEAD)"
          echo "reviewed_head=$reviewed_head" >> "$GITHUB_OUTPUT"
          cp Tools/finalize_planfuzz_o005_review.py "$RUNNER_TEMP/finalize_planfuzz_o005_review.py"
          git rm \
            .github/planfuzz-o005-finalize.trigger \
            .github/workflows/planfuzz-o005-finalize.yml \
            Tools/finalize_planfuzz_o005_review.py
          ./build.sh --skip-docs
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/o005-final-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/o005-final-evidence"

      - name: Generate clean campaign evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project UniversalToolchain/UniversalToolchain.PlanFuzz.Cli/UniversalToolchain.PlanFuzz.Cli.csproj -c Release --no-build -- \
            campaign \
            --adapter acme-pricing \
            --seed 20260725 \
            --cases 25 \
            --repeat 2 \
            --timeout-seconds 20 \
            --output "$EVIDENCE_ROOT/clean"

      - name: Generate seeded replay evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cli=(dotnet run --project UniversalToolchain/UniversalToolchain.PlanFuzz.Cli/UniversalToolchain.PlanFuzz.Cli.csproj -c Release --no-build --)
          for fault in SF-005-excluded-provider-activated SF-011-extension-noninterference; do
            case_path="$EVIDENCE_ROOT/$fault-case.json"
            replay_path="$EVIDENCE_ROOT/$fault-replay"
            "${cli[@]}" generate \
              --adapter acme-pricing \
              --seed 20260725 \
              --index 0 \
              --fault "$fault" \
              --out "$case_path"
            set +e
            "${cli[@]}" replay \
              --case "$case_path" \
              --output "$replay_path" \
              --repeat 3 \
              --timeout-seconds 20
            status=$?
            set -e
            test "$status" -eq 4
          done

      - name: Synchronize evidence, documentation and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$RUNNER_TEMP/finalize_planfuzz_o005_review.py" \
            --clean "$EVIDENCE_ROOT/clean" \
            --sf005 "$EVIDENCE_ROOT/SF-005-excluded-provider-activated-replay" \
            --sf011 "$EVIDENCE_ROOT/SF-011-extension-noninterference-replay" \
            --reviewed-head '${{ steps.prepare.outputs.reviewed_head }}'

      - name: Validate documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          npm ci --no-audit --no-fund
          npm run docs:status
          npm run docs:links
          npm run docs:build
          python3 .github/scripts/run-markdown-bash-blocks.py

      - name: Commit finalized tree
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(research): finalize reviewed O-005 evidence'
          git push origin HEAD:research/planfuzz-o005-evidence-hardening
