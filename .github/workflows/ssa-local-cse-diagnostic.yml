name: Local CSE diagnostic

on:
  pull_request:
    branches: [master]

jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Run canonical validation and capture tail
        shell: bash
        run: |
          set +e
          ./build.sh --skip-docs --skip-pack > validation.log 2>&1
          status=$?
          tail -n 500 validation.log > validation-tail.log
          exit "$status"

      - name: Upload diagnostic tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssa-local-cse-validation-tail
          path: validation-tail.log
          if-no-files-found: error
          retention-days: 1
