name: Run alpha terminology migrator

on:
  push:
    branches:
      - docs-alpha-terminology-20260715
    paths:
      - .github/workflows/run-alpha-migrator.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-alpha-terminology-20260715
      - name: Run migrator and capture diagnostics
        shell: bash
        run: |
          set +e
          python3 Tools/apply_alpha_terminology.py > alpha-migration.log 2>&1
          status=$?
          cat alpha-migration.log
          if [ "$status" -ne 0 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add alpha-migration.log
            git commit -m 'chore: record alpha migration failure'
            git push origin HEAD:docs-alpha-terminology-20260715
            exit "$status"
          fi
          set -e
          python3 Tools/check_documentation_status.py
          rm -f Tools/apply_alpha_terminology.py alpha-migration.log alpha-terminology-report.txt
          find . -type f \
            ! -path './.git/*' \
            ! -path './MANIFEST.sha256' \
            ! -path './.github/workflows/audit-alpha-terminology.yml' \
            ! -path './.github/workflows/apply-alpha-terminology.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v2.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v3.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v4.yml' \
            ! -path './.github/workflows/run-alpha-migrator.yml' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: use alpha terminology consistently'
          git push origin HEAD:docs-alpha-terminology-20260715
