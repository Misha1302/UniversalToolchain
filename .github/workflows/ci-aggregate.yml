name: CI aggregate

on:
  push:
    branches:
      - master

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  aggregate:
    name: Wait for all workflows
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout CI contract
        uses: actions/checkout@v4

      - name: Wait for all required push workflows for this commit
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha;
            const branch = context.ref.replace('refs/heads/', '');
            const statusContext = 'ci/aggregate';
            const contract = JSON.parse(fs.readFileSync('eng/ci-required-workflows.json', 'utf8'));
            const acceptableConclusions = new Set(contract.allowedConclusions);
            const requiredWorkflows = new Set(
              contract.requiredForCodeAcceptance.map(entry => entry.name),
            );
            if (acceptableConclusions.size !== 1 || !acceptableConclusions.has('success')) {
              core.setFailed('Canonical CI contract must allow only success for required workflows.');
              return;
            }
            if (requiredWorkflows.size !== contract.requiredForCodeAcceptance.length) {
              core.setFailed('Canonical CI contract contains duplicate required workflow names.');
              return;
            }

            const deadline = Date.now() + 30 * 60 * 1000;
            let stableCompletedSnapshots = 0;
            let previousCompletedIds = '';

            async function publish(state, description, targetUrl = null) {
              await github.rest.repos.createCommitStatus({
                owner,
                repo,
                sha,
                state,
                context: statusContext,
                description: description.slice(0, 140),
                target_url: targetUrl ?? `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
            }

            await publish('pending', 'Waiting for the complete required CI suite on this commit');

            while (Date.now() < deadline) {
              const response = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                branch,
                event: 'push',
                head_sha: sha,
                per_page: 100,
              });

              const runs = response.data.workflow_runs.filter(
                run => run.id !== context.runId && run.name !== context.workflow,
              );
              const requiredRuns = runs.filter(run => requiredWorkflows.has(run.name));
              const names = new Set(requiredRuns.map(run => run.name));
              const missingRequired = [...requiredWorkflows].filter(name => !names.has(name));
              const active = requiredRuns.filter(run => run.status !== 'completed');

              if (missingRequired.length > 0 || active.length > 0) {
                stableCompletedSnapshots = 0;
                previousCompletedIds = '';
                const waiting = [
                  ...missingRequired.map(name => `missing:${name}`),
                  ...active.map(run => `${run.name}:${run.status}`),
                ];
                await publish('pending', `Waiting: ${waiting.join(', ')}`);
                core.info(`Waiting: ${waiting.join(', ')}`);
                await new Promise(resolve => setTimeout(resolve, 15000));
                continue;
              }

              const completedIds = requiredRuns.map(run => run.id).sort((a, b) => a - b).join(',');
              if (completedIds === previousCompletedIds) {
                stableCompletedSnapshots += 1;
              } else {
                stableCompletedSnapshots = 1;
                previousCompletedIds = completedIds;
              }

              if (stableCompletedSnapshots < 2) {
                core.info('All required workflows completed; waiting for one stable confirmation snapshot.');
                await new Promise(resolve => setTimeout(resolve, 15000));
                continue;
              }

              const failed = requiredRuns.filter(run => !acceptableConclusions.has(run.conclusion));
              if (failed.length > 0) {
                const primary = failed[0];
                const summary = failed.map(run => `${run.name}#${run.id}:${run.conclusion}`).join(', ');
                await publish(
                  'failure',
                  `Failed: ${primary.name} #${primary.id} (${primary.conclusion})`,
                  primary.html_url,
                );
                core.setFailed(`Failed required workflows: ${summary}`);
                return;
              }

              const summary = requiredRuns.map(run => `${run.name}#${run.id}:${run.conclusion}`).join(', ');
              core.info(`All required workflows succeeded: ${summary}`);
              await publish('success', `${requiredRuns.length} required workflows completed successfully`);
              return;
            }

            await publish('failure', 'Timed out waiting for the complete required CI suite');
            core.setFailed('Timed out waiting for the complete required CI suite on this commit. Missing workflows fail closed.');
