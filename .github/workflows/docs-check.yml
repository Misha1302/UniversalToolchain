name: Docs Check

on:
  pull_request:
    paths:
      - 'readme.md'
      - 'AGENTS.md'
      - 'samples/Acme.PricingLanguage/README.md'
      - 'docs/**'
      - 'internal-docs/**'
      - 'UniversalToolchain/UniversalToolchain.Wist/**'
      - 'eng/documentation-release-state.json'
      - 'eng/wist-package-surface.json'
      - 'Tools/check_documentation_*.py'
      - 'Tools/test-documentation-*.py'
      - 'Tools/check-wist-documentation-*.py'
      - 'Tools/test-wist-documentation-*.py'
      - 'Tools/check-wist-release-readiness-docs.py'
      - 'Tools/test-wist-release-readiness-doc-mutants.py'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs-check.yml'
      - '.github/workflows/deploy-docs.yml'
      - '.github/workflows/published-package-smoke.yml'
      - 'global.json'
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate documentation structure, release state and links
        run: npm run docs:status && npm run docs:links

      - name: Reject SDK onboarding and policy-path regressions
        run: python3 Tools/test-documentation-onboarding.py

      - name: Reject Wist release-readiness documentation mutants
        run: npm run docs:readiness-mutants

      - name: Compile first-contact Wist documentation snippets
        run: npm run docs:first-contact

      - name: Reject documentation release-state mutants
        run: python3 Tools/test-documentation-release-state-mutants.py --root .

      - name: Reject Wist first-contact documentation mutants
        run: python3 Tools/test-wist-documentation-first-contact-mutants.py --root .

      - name: Reject GitHub Pages invariant mutants
        run: npm run docs:pages-selftest

      - name: Build documentation
        run: npm run docs:build

      - name: Verify GitHub Pages deployment invariants
        run: npm run docs:pages
