name: Wist Rollout Sample Smoke

on:
  pull_request:
    paths:
      - 'readme.md'
      - 'samples/Wist.RolloutScoring/**'
      - 'UniversalToolchain/UniversalToolchain.Wist/**'
      - 'UniversalToolchain/UniversalToolchain.Dialects.Wist/**'
      - 'UniversalToolchain/Dialects/examples/wist/pricing-restricted/**'
      - 'build.sh'
      - 'build.ps1'
      - '.github/workflows/wist-rollout-sample-smoke.yml'
  push:
    branches: [ master ]
    paths:
      - 'readme.md'
      - 'samples/Wist.RolloutScoring/**'
      - 'UniversalToolchain/UniversalToolchain.Wist/**'
      - 'UniversalToolchain/UniversalToolchain.Dialects.Wist/**'
      - 'UniversalToolchain/Dialects/examples/wist/pricing-restricted/**'
      - 'build.sh'
      - 'build.ps1'
      - '.github/ci-trigger'
      - '.github/workflows/wist-rollout-sample-smoke.yml'

permissions:
  contents: read

jobs:
  rollout-sample:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Prepare optional local NuGet feed
        run: mkdir -p UniversalToolchain/packages

      - name: Restore sample
        run: >
          dotnet restore samples/Wist.RolloutScoring/Wist.RolloutScoring.csproj
          --disable-parallel
          -p:RestoreBuildInParallel=false
          -p:UseSharedCompilation=false
          -p:NuGetAudit=false
          --verbosity quiet

      - name: Build sample
        run: >
          dotnet build samples/Wist.RolloutScoring/Wist.RolloutScoring.csproj
          -c Release
          --no-restore
          -m:1
          -p:BuildInParallel=false
          -p:UseSharedCompilation=false
          -p:NuGetAudit=false
          --verbosity quiet

      - name: Run and verify sample
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/wist-rollout-sample.log"
          status=0
          dotnet samples/Wist.RolloutScoring/bin/Release/net10.0/Wist.RolloutScoring.dll >"$log" 2>&1 || status=$?
          cat "$log"
          if ((status != 0)); then
            exit "$status"
          fi
          grep -Fq '✓ validated before execution' "$log"
          grep -Fq '✓ compiled once to Func<double, double, double, double>' "$log"
          grep -Fq '✓ score: 82.0 -> enable dashboard: True' "$log"
          grep -Fq '✗ rejected a statement-style rule before execution' "$log"

      - name: Upload sample failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wist-rollout-sample-failure
          path: ${{ runner.temp }}/wist-rollout-sample.log
          if-no-files-found: ignore
          retention-days: 3
