name: .NET CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Restore
        run: dotnet restore UniversalToolchain/Wist.sln

      - name: Build
        run: dotnet build UniversalToolchain/Wist.sln -c Release --no-restore

      - name: Test
        run: dotnet test UniversalToolchain/Tests/Tests.csproj -c Release --no-build
