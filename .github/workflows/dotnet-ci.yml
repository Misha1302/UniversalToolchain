name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore, build, and test through canonical entrypoint
        shell: bash
        run: |
          set +e
          ./build.sh --skip-docs > "$RUNNER_TEMP/canonical-build.log" 2>&1
          status=$?
          tail -n 200 "$RUNNER_TEMP/canonical-build.log"
          exit "$status"

      - name: Canonical package matrix and consumer smokes
        run: echo "Validated by build.sh through eng/package-projects.txt"

      - name: Install docs dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build docs
        run: npm run docs:status && npm run docs:links && npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py
