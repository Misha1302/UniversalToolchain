name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore UniversalToolchain/Wist.sln

      - name: Build
        run: dotnet build UniversalToolchain/Wist.sln -c Release --no-restore

      - name: Test
        run: dotnet test UniversalToolchain/Wist.sln -c Release --no-build

      - name: Install docs dependencies
        run: npm install

      - name: Build docs
        run: npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py
