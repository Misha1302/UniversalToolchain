name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore
        run: dotnet restore UniversalToolchain/Wist.sln

      - name: Build
        run: dotnet build UniversalToolchain/Wist.sln -c Release --no-restore

      - name: Test
        run: dotnet test UniversalToolchain/Wist.sln -c Release --no-build

      - name: Pack Wist facade
        run: >
          dotnet pack UniversalToolchain/UniversalToolchain.Wist/UniversalToolchain.Wist.csproj
          -c Release
          -o artifacts/packages
          /p:WarningsAsErrors=NU5118

      - name: Check Wist facade package artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/packages/UniversalToolchain.Wist.0.1.0-preview.1.nupkg
          test -f artifacts/packages/UniversalToolchain.Wist.0.1.0-preview.1.snupkg
          ls -la artifacts/packages

      - name: Smoke test Wist facade package
        shell: bash
        run: |
          set -euo pipefail

          smoke_dir="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$smoke_dir"

          dotnet add "$smoke_dir" package UniversalToolchain.Wist \
            --version 0.1.0-preview.1 \
            --source "$GITHUB_WORKSPACE/artifacts/packages"

          cat > "$smoke_dir/Program.cs" <<'EOF'
          using UniversalToolchain.Wist;

          using var safe = WistEngine.CreateSafeFormulas();

          var formula = safe.CompileFunc<double, double, double>(
              "price * 0.9 + fee",
              "price",
              "fee");

          double compiledResult = formula.Invoke(100.0, 5.0);

          if (Math.Abs(compiledResult - 95.0) > 1e-9)
          {
              throw new InvalidOperationException($"Expected 95, got {compiledResult}.");
          }

          double evaluatedResult = safe.Evaluate<double>(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (Math.Abs(evaluatedResult - 95.0) > 1e-9)
          {
              throw new InvalidOperationException($"Expected 95, got {evaluatedResult}.");
          }

          var validation = safe.Validate(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (!validation.IsValid)
          {
              throw new InvalidOperationException($"Expected validation success, got {validation.Message}.");
          }

          using var business = WistEngine.CreateBusinessRules();
          var businessValidation = business.Validate(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (!businessValidation.IsValid)
          {
              throw new InvalidOperationException($"Expected business preset validation success, got {businessValidation.Message}.");
          }

          using var trusted = WistEngine.CreateTrusted();
          var trustedValidation = trusted.Validate(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (!trustedValidation.IsValid)
          {
              throw new InvalidOperationException($"Expected trusted preset validation success, got {trustedValidation.Message}.");
          }

          Console.WriteLine("UniversalToolchain.Wist package smoke passed.");
          EOF

          dotnet run --project "$smoke_dir" -c Release

      - name: Install docs dependencies
        run: npm install

      - name: Build docs
        run: npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py


  sdk-cecil-bootstrap:
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/sdk-cecil-bootstrap-20260623'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Package .NET SDK and Mono.Cecil
        shell: bash
        run: |
          set -euo pipefail

          bridge_dir="$GITHUB_WORKSPACE/artifacts/sdk-cecil-bootstrap"
          seed_dir="$(mktemp -d)"
          mkdir -p "$bridge_dir"

          dotnet new console --framework net10.0 --output "$seed_dir"
          dotnet add "$seed_dir" package Mono.Cecil --version 0.11.6

          sdk_version="$(dotnet --version)"
          sdk_major="${sdk_version%%.*}"
          runtime_version="$(
            dotnet --list-runtimes |
              awk -v prefix="$sdk_major." '$1 == "Microsoft.NETCore.App" && index($2, prefix) == 1 { print $2 }' |
              sort -V |
              tail -n 1
          )"

          test -n "$runtime_version"
          dotnet_root="$(dirname "$(readlink -f "$(command -v dotnet)")")"

          entries=(
            dotnet
            "host/fxr/$runtime_version"
            "sdk/$sdk_version"
            "shared/Microsoft.NETCore.App/$runtime_version"
            "packs/Microsoft.NETCore.App.Ref/$runtime_version"
            "packs/Microsoft.NETCore.App.Host.linux-x64/$runtime_version"
          )

          for entry in "${entries[@]}"
          do
            test -e "$dotnet_root/$entry"
          done

          tar -C "$dotnet_root" -czf "$bridge_dir/dotnet-sdk-linux-x64.tar.gz" "${entries[@]}"
          cp "$HOME/.nuget/packages/mono.cecil/0.11.6/mono.cecil.0.11.6.nupkg" "$bridge_dir/"

          {
            printf 'sdk_version=%s\n' "$sdk_version"
            printf 'runtime_version=%s\n' "$runtime_version"
            sha256sum "$bridge_dir/dotnet-sdk-linux-x64.tar.gz"
            sha256sum "$bridge_dir/mono.cecil.0.11.6.nupkg"
          } | tee "$bridge_dir/MANIFEST.txt"

      - name: Upload SDK bridge artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-cecil-bootstrap-linux-x64
          path: artifacts/sdk-cecil-bootstrap
          if-no-files-found: error
          retention-days: 1
