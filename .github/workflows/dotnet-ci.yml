name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run canonical build and test entrypoint
        id: canonical
        shell: bash
        run: |
          set +e
          ./build.sh --skip-docs --skip-pack > "$RUNNER_TEMP/canonical-build.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 "$RUNNER_TEMP/canonical-build.log"
          exit 0

      - name: Upload canonical build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-build-log
          path: ${{ runner.temp }}/canonical-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce canonical entrypoint result
        shell: bash
        run: exit "${{ steps.canonical.outputs.status }}"

      - name: Record release-package boundary
        run: echo "Release packaging is a separate baseline-bearing gate; ordinary CI never weakens or fabricates its required previous-source inputs."

      - name: Install docs dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build docs
        run: npm run docs:status && npm run docs:links && npm run docs:first-contact && npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py

  windows-build-test:
    permissions:
      contents: read
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Run canonical PowerShell build and test entrypoint
        shell: pwsh
        run: ./build.ps1 -SkipDocs -SkipPack
