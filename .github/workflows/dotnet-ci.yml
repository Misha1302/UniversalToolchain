name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore, build, and test through canonical entrypoint
        run: ./build.sh --skip-docs --skip-pack

      - name: Pack Wist facade
        run: >
          dotnet pack UniversalToolchain/UniversalToolchain.Wist/UniversalToolchain.Wist.csproj
          -c Release
          -o artifacts/packages
          /p:WarningsAsErrors=NU5118

      - name: Enforce Wist package boundary
        run: python3 Tools/check-wist-package-surface.py artifacts/packages/*.nupkg

      - name: Check Wist facade package artifacts
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -nE 's:.*<Version>([^<]+)</Version>.*:\1:p' UniversalToolchain/UniversalToolchain.Wist/UniversalToolchain.Wist.csproj)"
          test -n "$package_version"
          test -f "artifacts/packages/UniversalToolchain.Wist.${package_version}.nupkg"
          test -f "artifacts/packages/UniversalToolchain.Wist.${package_version}.snupkg"
          ls -la artifacts/packages

      - name: Smoke test Wist facade package
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(sed -nE 's:.*<Version>([^<]+)</Version>.*:\1:p' UniversalToolchain/UniversalToolchain.Wist/UniversalToolchain.Wist.csproj)"
          test -n "$package_version"

          smoke_dir="$(mktemp -d)"
          dotnet new console --framework net10.0 --output "$smoke_dir"

          dotnet add "$smoke_dir" package UniversalToolchain.Wist \
            --version "$package_version" \
            --source "$GITHUB_WORKSPACE/artifacts/packages"

          cat > "$smoke_dir/Program.cs" <<'EOF'
          using UniversalToolchain.Wist;

          using var restricted = WistEngine.CreateRestrictedArithmetic();

          var compiledProgram = restricted.Compile<Func<double, double, double>>(
              "price * 0.9 + fee",
              "price",
              "fee");

          double compiledResult = compiledProgram.CompiledDelegate(100.0, 5.0);

          if (Math.Abs(compiledResult - 95.0) > 1e-9)
          {
              throw new InvalidOperationException($"Expected 95, got {compiledResult}.");
          }

          double evaluatedResult = restricted.Evaluate<double>(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (Math.Abs(evaluatedResult - 95.0) > 1e-9)
          {
              throw new InvalidOperationException($"Expected 95, got {evaluatedResult}.");
          }

          var validation = restricted.Validate(
              "price * 0.9 + fee",
              new
              {
                  price = 100.0,
                  fee = 5.0
              });

          if (!validation.IsValid)
          {
              throw new InvalidOperationException($"Expected validation success, got {validation.Message}.");
          }

          using var fullNative = WistEngine.CreateFullNativePreview();
          var fullNativeValidation = fullNative.Validate("1 + 2");
          if (!fullNativeValidation.IsValid)
          {
              throw new InvalidOperationException($"Expected full-native validation success, got {fullNativeValidation.Message}.");
          }

          Console.WriteLine("UniversalToolchain.Wist package smoke passed.");
          EOF

          dotnet run --project "$smoke_dir" -c Release

      - name: Install docs dependencies
        run: npm ci --no-audit --no-fund

      - name: Build docs
        run: npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py
