name: .NET CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run canonical entrypoint
        id: canonical
        shell: bash
        run: |
          set +e
          ./build.sh --skip-docs > "$RUNNER_TEMP/canonical-build.log" 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          tail -n 200 "$RUNNER_TEMP/canonical-build.log"
          exit 0

      - name: Upload canonical build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-build-log
          path: ${{ runner.temp }}/canonical-build.log
          if-no-files-found: error
          retention-days: 3

      - name: Enforce canonical entrypoint result
        shell: bash
        run: exit "${{ steps.canonical.outputs.status }}"

      - name: Generate recursive manifest candidate
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          with Path("${{ runner.temp }}/MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY

      - name: Upload recursive manifest candidate
        uses: actions/upload-artifact@v4
        with:
          name: recursive-manifest-candidate
          path: ${{ runner.temp }}/MANIFEST.sha256
          if-no-files-found: error
          retention-days: 3

      - name: Verify recursive manifest
        run: cmp MANIFEST.sha256 "$RUNNER_TEMP/MANIFEST.sha256"

      - name: Canonical package matrix and consumer smokes
        run: echo "Validated by build.sh through eng/package-projects.txt"

      - name: Install docs dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and build docs
        run: npm run docs:status && npm run docs:links && npm run docs:build

      - name: Markdown bash smoke checks
        shell: bash
        run: python3 .github/scripts/run-markdown-bash-blocks.py

  refresh-manifest:
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Refresh recursive manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --check
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh recursive manifest"
          git push origin "HEAD:${GITHUB_REF_NAME}"

  finalize-o005-evidence:
    if: github.event_name == 'pull_request' && github.head_ref == 'research/planfuzz-o005-evidence-hardening' && github.actor != 'github-actions[bot]'
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-o005-evidence-hardening
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare evidence workspace
        shell: bash
        run: |
          set -Eeuo pipefail
          test -f .github/planfuzz-o005-evidence-trigger
          cp Tools/finalize_planfuzz_o005_evidence.py "$RUNNER_TEMP/finalize_planfuzz_o005_evidence.py"
          git rm .github/planfuzz-o005-evidence-trigger Tools/finalize_planfuzz_o005_evidence.py
          git checkout origin/master -- .github/workflows/dotnet-ci.yml
          ./build.sh --skip-docs
          echo "EVIDENCE_ROOT=$RUNNER_TEMP/o005-evidence" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/o005-evidence"

      - name: Generate clean campaign evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          dotnet run --project UniversalToolchain/UniversalToolchain.PlanFuzz.Cli/UniversalToolchain.PlanFuzz.Cli.csproj -c Release --no-build -- \
            campaign --adapter acme-pricing --seed 20260725 --cases 25 --repeat 2 --timeout-seconds 20 --output "$EVIDENCE_ROOT/clean"

      - name: Generate SF-005 replay evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cli=(dotnet run --project UniversalToolchain/UniversalToolchain.PlanFuzz.Cli/UniversalToolchain.PlanFuzz.Cli.csproj -c Release --no-build --)
          "${cli[@]}" generate --adapter acme-pricing --seed 20260725 --index 0 --fault SF-005-excluded-provider-activated --out "$EVIDENCE_ROOT/SF-005-case.json"
          set +e
          "${cli[@]}" replay --case "$EVIDENCE_ROOT/SF-005-case.json" --output "$EVIDENCE_ROOT/SF-005-replay" --repeat 3 --timeout-seconds 20
          status=$?
          set -e
          test "$status" -eq 4

      - name: Generate SF-011 replay evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          cli=(dotnet run --project UniversalToolchain/UniversalToolchain.PlanFuzz.Cli/UniversalToolchain.PlanFuzz.Cli.csproj -c Release --no-build --)
          "${cli[@]}" generate --adapter acme-pricing --seed 20260725 --index 0 --fault SF-011-extension-noninterference --out "$EVIDENCE_ROOT/SF-011-case.json"
          set +e
          "${cli[@]}" replay --case "$EVIDENCE_ROOT/SF-011-case.json" --output "$EVIDENCE_ROOT/SF-011-replay" --repeat 3 --timeout-seconds 20
          status=$?
          set -e
          test "$status" -eq 4

      - name: Upload raw O-005 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o005-raw-evidence
          path: ${{ runner.temp }}/o005-evidence
          if-no-files-found: warn
          retention-days: 3

      - name: Finalize evidence and documentation
        id: finalizer
        shell: bash
        run: |
          set +e
          python3 "$RUNNER_TEMP/finalize_planfuzz_o005_evidence.py" \
            --clean "$EVIDENCE_ROOT/clean" \
            --sf005 "$EVIDENCE_ROOT/SF-005-replay" \
            --sf011 "$EVIDENCE_ROOT/SF-011-replay" \
            > "$RUNNER_TEMP/o005-finalizer.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/o005-finalizer.log"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload O-005 finalizer diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: o005-finalizer-diagnostics
          path: ${{ runner.temp }}/o005-finalizer.log
          if-no-files-found: warn
          retention-days: 3

      - name: Enforce finalizer result
        shell: bash
        run: exit "${{ steps.finalizer.outputs.status }}"

      - name: Install docs dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate finalized documentation
        shell: bash
        run: |
          set -Eeuo pipefail
          npm run docs:status
          npm run docs:links
          npm run docs:build
          python3 .github/scripts/run-markdown-bash-blocks.py

      - name: Stage finalized evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git add -A
          git diff --cached --check

      - name: Commit finalized evidence
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(research): finalize O-005 evidence identity'
          git push origin HEAD:research/planfuzz-o005-evidence-hardening
