          strict = "UniversalToolchain/UniversalToolchain.PlanFuzz.IntegrationTests/StrictReplayTests.cs"
          replace_exact(strict, 'Is.All.EqualTo("observed-language-route-runtime-v2")', 'Is.All.EqualTo("observed-language-route-runtime-v3")')
          strict_anchor = '''    [Test]
    public async Task ReplayWithoutOracleContractsReturnsInconclusive()
