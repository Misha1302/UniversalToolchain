name: Diagnose PlanFuzz reducer transport

on:
  push:
    branches:
      - research/planfuzz-reducer
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reducer branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-reducer

      - name: Export exact branch snapshot
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/reducer-transport-snapshot.tar.gz" .

      - name: Upload branch snapshot
        uses: actions/upload-artifact@v4
        with:
          name: reducer-transport-snapshot
          path: ${{ runner.temp }}/reducer-transport-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 1
