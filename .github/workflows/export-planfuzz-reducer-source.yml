name: Apply verified PlanFuzz reducer

on:
  push:
    branches:
      - research/planfuzz-reducer
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-reducer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reducer branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-reducer
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/planfuzz-reducer-patch/chunk* > "$RUNNER_TEMP/reducer.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/reducer.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/reducer.patch"
          echo '18f43fffafc3f8354b469e03d9ebe8da4e9645ca422e9ecb7a189c3cebf1f648  '"$RUNNER_TEMP/reducer.patch" | sha256sum --check

      - name: Apply reducer implementation
        shell: bash
        run: patch -p1 --forward < "$RUNNER_TEMP/reducer.patch"

      - name: Remove transport files
        shell: bash
        run: git rm -r .github/planfuzz-reducer-patch .github/workflows/export-planfuzz-reducer-source.yml

      - name: Refresh recursive source manifest
        shell: bash
        run: |
          git add -A
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "--cached", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git add MANIFEST.sha256
          git diff --cached --check

      - name: Commit reducer
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(research): add deterministic PlanFuzz reduction'
          git push origin HEAD:research/planfuzz-reducer
