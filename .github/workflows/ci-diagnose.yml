name: CI diagnose

on:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/ci-diagnose.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Publish failed benchmark run identity
        uses: actions/github-script@v7
        with:
          script: |
            const targetSha = '5aab5c5482b12f3b24f5702a8e673ab2341de274';
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
              event: 'push',
              head_sha: targetSha,
              per_page: 100,
            });
            const run = response.data.workflow_runs.find(item => item.name === 'Benchmark Smoke');
            if (!run) {
              core.setFailed(`Benchmark Smoke run not found for ${targetSha}`);
              return;
            }
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: run.conclusion === 'failure' ? 'failure' : 'success',
              context: 'ci/benchmark-diagnosis',
              description: `Benchmark run ${run.id}: ${run.conclusion}`,
              target_url: run.html_url,
            });
            core.info(`Benchmark run: ${run.id} ${run.html_url} ${run.conclusion}`);
