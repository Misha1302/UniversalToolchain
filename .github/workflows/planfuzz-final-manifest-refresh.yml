name: PlanFuzz Final Manifest Refresh

on:
  push:
    branches:
      - research/planfuzz-phase1-wist
    paths:
      - .github/planfuzz-final-manifest.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: research/planfuzz-phase1-wist

      - name: Remove bootstrap and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/planfuzz-final-manifest.trigger
          git rm .github/workflows/planfuzz-final-manifest-refresh.yml
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MANIFEST.sha256
          git diff --cached --check
          git commit -m "chore: finalize recursive manifest"
          git push origin HEAD:research/planfuzz-phase1-wist
