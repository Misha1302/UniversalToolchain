name: Clean value-reuse preflight integration once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Clean integration and refresh manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          def replace_once(path, old, new):
              file = pathlib.Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'Expected marker missing in {path}: {old!r}')
              if count != 1:
                  raise SystemExit(f'Expected one marker in {path}, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          converter = 'UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs'
          replace_once(
              converter,
              '''        var valueReuseDiagnostics = SsaToAirValueReusePreflight.Analyze(function, planner);
                          if (valueReuseDiagnostics.Count != 0)
                              ThrowDiagnostics(valueReuseDiagnostics);

                          var air = new AbstractIR();
                          foreach (var block in state.Blocks)
                          {
                          EmitBlock(air, block, state, planner);
                      }''',
              '''        var valueReuseDiagnostics = SsaToAirValueReusePreflight.Analyze(function, planner);
                      if (valueReuseDiagnostics.Count != 0)
                          ThrowDiagnostics(valueReuseDiagnostics);

                      var air = new AbstractIR();
                      foreach (var block in state.Blocks)
                      {
                          EmitBlock(air, block, state, planner);
                      }''')

          preflight = 'UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirValueReusePreflight.cs'
          replace_once(
              preflight,
              '''        operation.Results.Count == 1 &&
                      operation.OpId is var opId &&
                      (opId == SsaOperations.ConstantInt32 ||''',
              '''        operation.Results.Count == 1 &&
                      (operation.OpId == SsaOperations.ConstantInt32 ||''')
          replace_once(preflight, '         opId == SsaOperations.ConstantBool ||', '         operation.OpId == SsaOperations.ConstantBool ||')
          replace_once(preflight, '         opId == SsaOperations.ConstantFloat64 ||', '         operation.OpId == SsaOperations.ConstantFloat64 ||')
          replace_once(preflight, '         opId == SsaOperations.LoadExternalInt32 ||', '         operation.OpId == SsaOperations.LoadExternalInt32 ||')
          replace_once(preflight, '         opId == SsaOperations.LoadExternalBool ||', '         operation.OpId == SsaOperations.LoadExternalBool ||')
          replace_once(preflight, '         opId == SsaOperations.LoadExternalFloat64);', '         operation.OpId == SsaOperations.LoadExternalFloat64);')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-value-reuse-cleanup-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit cleanup when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirValueReusePreflight.cs \
            MANIFEST.sha256
          git commit -m "ssa: clean value-reuse preflight integration"
          git push origin "HEAD:${{ github.head_ref }}"
