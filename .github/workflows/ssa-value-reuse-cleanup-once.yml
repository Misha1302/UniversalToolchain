name: Clean value-reuse preflight integration once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Clean integration and refresh manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          converter = pathlib.Path('UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs')
          lines = converter.read_text(encoding='utf-8').splitlines()
          marker = 'var valueReuseDiagnostics = SsaToAirValueReusePreflight.Analyze(function, planner);'
          indices = [index for index, line in enumerate(lines) if line.strip() == marker]
          if len(indices) != 1:
              raise SystemExit(f'Expected one converter marker, found {len(indices)}')
          start = indices[0]
          end = start
          while end < len(lines) and lines[end].strip() != 'EmitBlock(air, block, state, planner);':
              end += 1
          if end >= len(lines) or end + 1 >= len(lines) or lines[end + 1].strip() != '}':
              raise SystemExit('Could not locate malformed emission block')
          replacement = [
              '        var valueReuseDiagnostics = SsaToAirValueReusePreflight.Analyze(function, planner);',
              '        if (valueReuseDiagnostics.Count != 0)',
              '            ThrowDiagnostics(valueReuseDiagnostics);',
              '',
              '        var air = new AbstractIR();',
              '        foreach (var block in state.Blocks)',
              '        {',
              '            EmitBlock(air, block, state, planner);',
              '        }',
          ]
          lines[start:end + 2] = replacement
          converter.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          preflight = pathlib.Path('UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirValueReusePreflight.cs')
          lines = preflight.read_text(encoding='utf-8').splitlines()
          indices = [index for index, line in enumerate(lines) if line.strip() == 'operation.OpId is var opId &&']
          if len(indices) != 1:
              raise SystemExit(f'Expected one operation-id marker, found {len(indices)}')
          start = indices[0]
          expected = [
              'operation.OpId is var opId &&',
              '(opId == SsaOperations.ConstantInt32 ||',
              'opId == SsaOperations.ConstantBool ||',
              'opId == SsaOperations.ConstantFloat64 ||',
              'opId == SsaOperations.LoadExternalInt32 ||',
              'opId == SsaOperations.LoadExternalBool ||',
              'opId == SsaOperations.LoadExternalFloat64);',
          ]
          actual = [line.strip() for line in lines[start:start + len(expected)]]
          if actual != expected:
              raise SystemExit(f'Unexpected operation-id block: {actual!r}')
          lines[start:start + len(expected)] = [
              '        (operation.OpId == SsaOperations.ConstantInt32 ||',
              '         operation.OpId == SsaOperations.ConstantBool ||',
              '         operation.OpId == SsaOperations.ConstantFloat64 ||',
              '         operation.OpId == SsaOperations.LoadExternalInt32 ||',
              '         operation.OpId == SsaOperations.LoadExternalBool ||',
              '         operation.OpId == SsaOperations.LoadExternalFloat64);',
          ]
          preflight.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-value-reuse-cleanup-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          manifest = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              manifest.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(manifest), encoding='utf-8')
          PY

      - name: Commit cleanup when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirValueReusePreflight.cs \
            MANIFEST.sha256
          git commit -m "ssa: clean value-reuse preflight integration"
          git push origin "HEAD:${{ github.head_ref }}"
