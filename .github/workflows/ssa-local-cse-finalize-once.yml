name: Finalize local CSE integration once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch integration files and refresh manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          def replace_once(path, old, new):
              file = pathlib.Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'Expected integration marker missing in {path}: {old!r}')
              if count != 1:
                  raise SystemExit(f'Expected one integration marker in {path}, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          cse = 'UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaLocalCommonSubexpressionEliminationPass.cs'
          replace_once(
              cse,
              '        IDictionary<SsaValueId, SsaValueId> substitutions)',
              '        Dictionary<SsaValueId, SsaValueId> substitutions)')
          replace_once(
              cse,
              '        var localSubstitutions = new Dictionary<SsaValueId, SsaValueId>();\n',
              '')
          replace_once(
              cse,
              '            var rewritten = RewriteInstructionUses(instruction, localSubstitutions);',
              '            var rewritten = RewriteInstructionUses(instruction, substitutions);')
          replace_once(
              cse,
              '            var canonical = Resolve(existing, localSubstitutions);',
              '            var canonical = Resolve(existing, substitutions);')
          replace_once(
              cse,
              '            localSubstitutions[result] = canonical;\n',
              '')
          replace_once(
              cse,
              '            terminator: RewriteTerminatorUses(block.Terminator, localSubstitutions));',
              '            terminator: RewriteTerminatorUses(block.Terminator, substitutions));')

          replace_once(
              'UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRouteProfile.cs',
              '        new SsaBranchFoldingAndCleanupPass(),\n        new SsaDeadPureInstructionEliminationPass(SsaCoreDescriptors.CoreOperations, SemanticDescriptors)',
              '        new SsaBranchFoldingAndCleanupPass(),\n        new SsaLocalCommonSubexpressionEliminationPass(SemanticDescriptors),\n        new SsaDeadPureInstructionEliminationPass(SsaCoreDescriptors.CoreOperations, SemanticDescriptors)')

          replace_once(
              'docs/architecture/ssa-coverage-matrix.md',
              '| SCCP-lite | Supported | block-argument constant propagation tests |\n| Branch/unreachable cleanup | Supported | branch folding and cleanup tests |',
              '| SCCP-lite | Supported | block-argument constant propagation tests |\n| Local common-subexpression elimination | Supported for trusted deterministic pure expressions within one block | local CSE safety and substitution regressions |\n| Branch/unreachable cleanup | Supported | branch folding and cleanup tests |')

          replace_once(
              'docs/architecture/ssa-coverage-matrix.md',
              '| Broader optimizer suite (GVN/CSE, LICM, inlining) | Required/preserved/invalidated facts and differential tests per pass |',
              '| Broader optimizer suite (cross-block GVN, LICM, inlining) | Required/preserved/invalidated facts and differential tests per pass |')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-local-cse-finalize-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit finalized integration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaLocalCommonSubexpressionEliminationPass.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRouteProfile.cs \
            docs/architecture/ssa-coverage-matrix.md \
            MANIFEST.sha256
          git commit -m "ssa: wire local CSE into preview profile"
          git push origin "HEAD:${{ github.head_ref }}"
