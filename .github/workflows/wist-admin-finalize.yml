name: Wist Admin Finalization

on:
  push:
    branches: [ master ]
    paths:
      - '.github/workflows/wist-admin-finalize.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.WIST_ADMIN_TOKEN }}
      OWNER: Misha1302
      ACTIVE_REPO: Wist2
      RESULT_PATH: docs/maintainers/.wist-admin-finalization-result.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate administrative token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo "Repository secret WIST_ADMIN_TOKEN is missing or empty." >&2
            exit 1
          fi
          status="$({ curl -sS -o /tmp/user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user; } || true)"
          if [[ "$status" != "200" ]]; then
            echo "WIST_ADMIN_TOKEN was rejected by GitHub (HTTP ${status})." >&2
            exit 1
          fi
          jq -e '.login == "Misha1302"' /tmp/user.json >/dev/null

      - name: Render and validate canonical social-preview PNG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          rsvg-convert \
            --width 1280 \
            --height 640 \
            --output docs/assets/wist-social-preview.png \
            docs/assets/wist-social-preview.svg
          python3 - <<'PY'
          import pathlib
          import struct

          path = pathlib.Path('docs/assets/wist-social-preview.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Rendered file does not have a PNG signature')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1280, 640):
              raise SystemExit(f'Unexpected PNG dimensions: {width}x{height}')
          if len(data) < 10_000:
              raise SystemExit(f'Rendered PNG is suspiciously small: {len(data)} bytes')
          print(f'Validated PNG: {width}x{height}, {len(data)} bytes')
          PY

      - name: Apply repository settings and archive historical repositories
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            local data="${3-}"
            local args=(
              -fsS --retry 3 --retry-all-errors
              -X "$method"
              -H "Authorization: Bearer ${ADMIN_TOKEN}"
              -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then
              args+=(-H 'Content-Type: application/json' --data "$data")
            fi
            curl "${args[@]}" "https://api.github.com${path}"
          }

          description='Restricted formulas for .NET: validate rules and compile approved formulas into typed delegates.'
          homepage='https://misha1302.github.io/Wist2/'

          repo_payload="$(jq -nc \
            --arg description "$description" \
            --arg homepage "$homepage" \
            '{description: $description, homepage: $homepage}')"
          api PATCH "/repos/${OWNER}/${ACTIVE_REPO}" "$repo_payload" >/tmp/wist2-repo-update.json

          topics_payload='{"names":["dotnet","csharp","rule-engine","expression-engine","embedded-dsl","business-rules","compiler","interpreter","cil","runtime","language-tooling","ssa"]}'
          api PUT "/repos/${OWNER}/${ACTIVE_REPO}/topics" "$topics_payload" >/tmp/wist2-topics-update.json

          for repo in Wist Wist4 Wist5 Wist2Msil; do
            api PATCH "/repos/${OWNER}/${repo}" '{"archived":true}' >"/tmp/${repo}-archive.json"
          done

          current_png="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/contents/docs/assets/wist-social-preview.png?ref=master")"
          current_png_sha="$(jq -er '.sha' <<<"$current_png")"
          rendered_png_b64="$(base64 -w0 docs/assets/wist-social-preview.png)"
          png_payload="$(jq -nc \
            --arg message 'fix: replace corrupted social preview PNG' \
            --arg content "$rendered_png_b64" \
            --arg sha "$current_png_sha" \
            --arg branch master \
            '{message: $message, content: $content, sha: $sha, branch: $branch}')"
          api PUT "/repos/${OWNER}/${ACTIVE_REPO}/contents/docs/assets/wist-social-preview.png" "$png_payload" >/tmp/png-update.json

          repo_state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}")"
          topics_state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/topics")"

          jq -e --arg expected "$description" '.description == $expected' <<<"$repo_state" >/dev/null
          jq -e --arg expected "$homepage" '.homepage == $expected' <<<"$repo_state" >/dev/null
          jq -e '.names == ["dotnet","csharp","rule-engine","expression-engine","embedded-dsl","business-rules","compiler","interpreter","cil","runtime","language-tooling","ssa"]' <<<"$topics_state" >/dev/null

          archived_json='{}'
          for repo in Wist Wist4 Wist5 Wist2Msil; do
            state="$(api GET "/repos/${OWNER}/${repo}")"
            jq -e '.archived == true' <<<"$state" >/dev/null
            archived_json="$(jq -nc --argjson old "$archived_json" --arg repo "$repo" '$old + {($repo): true}')"
          done

          png_sha256="$(sha256sum docs/assets/wist-social-preview.png | awk '{print $1}')"
          png_size="$(stat -c '%s' docs/assets/wist-social-preview.png)"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg status VERIFIED \
            --arg completed_at "$completed_at" \
            --arg description "$description" \
            --arg homepage "$homepage" \
            --arg png_sha256 "$png_sha256" \
            --argjson png_size "$png_size" \
            --argjson archived "$archived_json" \
            --argjson topics "$(jq -c '.names' <<<"$topics_state")" \
            '{
              status: $status,
              completed_at: $completed_at,
              repository: "Misha1302/Wist2",
              description: $description,
              homepage: $homepage,
              topics: $topics,
              social_preview_repository_file: {
                path: "docs/assets/wist-social-preview.png",
                width: 1280,
                height: 640,
                size_bytes: $png_size,
                sha256: $png_sha256,
                valid_png: true
              },
              archived_repositories: $archived,
              manual_actions_remaining: [
                "Upload the PNG in Settings -> General -> Social preview",
                "Pin Misha1302/Wist2 in the GitHub profile"
              ]
            }' >"$RESULT_PATH"

          report_b64="$(base64 -w0 "$RESULT_PATH")"
          report_payload="$(jq -nc \
            --arg message 'chore: record Wist repository finalization result' \
            --arg content "$report_b64" \
            --arg branch master \
            '{message: $message, content: $content, branch: $branch}')"
          api PUT "/repos/${OWNER}/${ACTIVE_REPO}/contents/${RESULT_PATH}" "$report_payload" >/tmp/report-update.json

      - name: Remove one-time workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          api() {
            local method="$1"
            local path="$2"
            local data="${3-}"
            local args=(
              -fsS --retry 3 --retry-all-errors
              -X "$method"
              -H "Authorization: Bearer ${ADMIN_TOKEN}"
              -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then
              args+=(-H 'Content-Type: application/json' --data "$data")
            fi
            curl "${args[@]}" "https://api.github.com${path}"
          }

          workflow_path='.github/workflows/wist-admin-finalize.yml'
          workflow_state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/contents/${workflow_path}?ref=master")"
          workflow_sha="$(jq -er '.sha' <<<"$workflow_state")"
          delete_payload="$(jq -nc \
            --arg message 'chore: remove completed one-time Wist finalization workflow' \
            --arg sha "$workflow_sha" \
            --arg branch master \
            '{message: $message, sha: $sha, branch: $branch}')"
          api DELETE "/repos/${OWNER}/${ACTIVE_REPO}/contents/${workflow_path}" "$delete_payload" >/tmp/workflow-delete.json
          echo 'Wist repository finalization completed and the one-time workflow removed.'
