name: UniversalToolchain validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  validate:
    name: Materialize v2 study, build, test, guard, and measure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          ref: icse2027-contract-experiment
          fetch-depth: 0
          show-progress: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Materialize reviewed v2 experiment bundle
        id: materialize
        shell: bash
        run: |
          set -u
          mkdir -p artifacts/bootstrap-diagnostics
          cat .github/icse-v2-bootstrap/part*.b64 > /tmp/icse-v2-patch.b64
          wc -c /tmp/icse-v2-patch.b64 | tee artifacts/bootstrap-diagnostics/base64-size.txt
          sha256sum /tmp/icse-v2-patch.b64 | tee artifacts/bootstrap-diagnostics/base64-sha256.txt

          set +e
          base64 --decode /tmp/icse-v2-patch.b64 > /tmp/icse-v2-patch.tar.gz 2> artifacts/bootstrap-diagnostics/base64-decode.stderr
          decode_status=$?
          echo "$decode_status" > artifacts/bootstrap-diagnostics/base64-decode.status
          wc -c /tmp/icse-v2-patch.tar.gz > artifacts/bootstrap-diagnostics/tar-size.txt
          sha256sum /tmp/icse-v2-patch.tar.gz > artifacts/bootstrap-diagnostics/tar-sha256.txt
          gzip -t /tmp/icse-v2-patch.tar.gz 2> artifacts/bootstrap-diagnostics/gzip-test.stderr
          gzip_status=$?
          echo "$gzip_status" > artifacts/bootstrap-diagnostics/gzip-test.status
          tar -tzf /tmp/icse-v2-patch.tar.gz > artifacts/bootstrap-diagnostics/tar-list.txt 2> artifacts/bootstrap-diagnostics/tar-list.stderr
          tar_status=$?
          echo "$tar_status" > artifacts/bootstrap-diagnostics/tar-list.status
          set -e

          if [[ "$decode_status" -ne 0 || "$gzip_status" -ne 0 || "$tar_status" -ne 0 ]]; then
            echo "Bootstrap archive validation failed: decode=$decode_status gzip=$gzip_status tar=$tar_status" | tee artifacts/bootstrap-diagnostics/failure.txt
            exit 1
          fi

          tar -xzf /tmp/icse-v2-patch.tar.gz
          git checkout HEAD -- .github/workflows/universal-toolchain-validation.yml
          rm -rf .github/icse-v2-bootstrap
          chmod +x Tools/run-contract-experiment.sh

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short | tee artifacts/bootstrap-diagnostics/git-status-before-commit.txt
          git commit -m 'research: strengthen contract study with challenge operators and stratified controls' 2>&1 | tee artifacts/bootstrap-diagnostics/git-commit.log
          commit_status=${PIPESTATUS[0]}
          if [[ "$commit_status" -ne 0 ]]; then
            echo "$commit_status" > artifacts/bootstrap-diagnostics/git-commit.status
            exit "$commit_status"
          fi
          git push origin HEAD:icse2027-contract-experiment 2>&1 | tee artifacts/bootstrap-diagnostics/git-push.log
          push_status=${PIPESTATUS[0]}
          echo "$push_status" > artifacts/bootstrap-diagnostics/git-push.status
          if [[ "$push_status" -ne 0 ]]; then
            exit "$push_status"
          fi
          commit="$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Install ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep

      - name: Capture environment and canonical build/test log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-evidence
          git rev-parse HEAD > artifacts/ci-evidence/commit.txt
          git status --porcelain=v1 > artifacts/ci-evidence/git-status.txt
          dotnet --info > artifacts/ci-evidence/dotnet-info.txt
          uname -a > artifacts/ci-evidence/uname.txt
          ./build.sh --skip-docs --skip-pack 2>&1 | tee artifacts/ci-evidence/build-test.log

      - name: BasicCore must not depend on high-level layers or concrete feature modules
        run: |
          ! rg "UniversalToolchain\.Rules|UniversalToolchain\.Dialects\.Wist|SafeMathFunctionsModule|ConditionsModule" UniversalToolchain/BasicCore -g "*.cs" -g "*.csproj"

      - name: Wist layer must not know SafeMath implementation
        run: |
          ! rg "SafeMathFunctionsModule|typeof\(SafeMathFunctions\)|nameof\(SafeMathFunctions" UniversalToolchain/UniversalToolchain.Dialects.Wist -g "*.cs"

      - name: Parser and resolver must not hardcode SafeMath function names
        run: |
          ! rg '"clamp"|"min"|"max"|"abs"' UniversalToolchain -g "*.cs" -g "!**/SafeMathFunctionsModule/**" -g "!**/*Tests*/**" -g "!**/docs/**"

      - name: IfExpression must not hardcode external module implementation details
        run: |
          ! rg "\b(RealNumberImpl|Addition|Multiplication|GreaterOrEqual|LessOrEqual)\b|NumbersModule\.Core" \
            UniversalToolchain/ConditionsModule \
            -g "*IfExpression*.cs"

      - name: Framework must not branch on product profile names
        run: |
          ! rg "PricingRules|ValidationRules|PolicyRules" UniversalToolchain -g "*.cs" -g "!**/*Tests*/**" -g "!Wistc/**" -g "!Dialects/examples/**" -g "!docs/**"

      - name: Run ICSE contract experiment
        env:
          ICSE_EXPERIMENT_REPLICATES: 5
          ICSE_CI_EVIDENCE_DIR: artifacts/ci-evidence
        run: |
          export GITHUB_SHA='${{ steps.materialize.outputs.commit }}'
          ./Tools/run-contract-experiment.sh artifacts/contract-experiment

      - name: Seal complete evidence package
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d artifacts/contract-experiment ]]; then
            mkdir -p artifacts/contract-experiment/ci
            cp -a artifacts/ci-evidence/. artifacts/contract-experiment/ci/
            (
              cd artifacts/contract-experiment
              find . -type f ! -name MANIFEST.sha256 -print0 \
                | sort -z \
                | xargs -0 sha256sum > MANIFEST.sha256
              sha256sum -c MANIFEST.sha256
            )
          fi

      - name: Upload ICSE contract experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: icse-contract-experiment-${{ steps.materialize.outputs.commit || github.sha }}
          path: |
            artifacts/contract-experiment
            artifacts/bootstrap-diagnostics
          if-no-files-found: error
          retention-days: 90
