name: CGO27 Apply Final Payload

on:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/cgo27-apply-final-payload.yml"
      - ".cgo27-final-payload/**"

permissions:
  contents: write

concurrency:
  group: cgo27-apply-final-payload
  cancel-in-progress: false

env:
  WORK_BRANCH: research/cgo27-submission-hardening
  SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact working branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.WORK_BRANCH }}
          fetch-depth: 0

      - name: Verify and apply checksum-locked payload
        shell: bash
        run: |
          set -euo pipefail
          export LC_ALL=C

          test "$(git rev-parse HEAD)" = "${SOURCE_HEAD_SHA}"
          test -d .cgo27-final-payload
          printf '%s\n' .cgo27-final-payload/chunk.* | sort | xargs cat > /tmp/cgo27-final-payload.b64
          base64 --decode /tmp/cgo27-final-payload.b64 > /tmp/cgo27-final-payload.tar.gz
          printf '%s  %s\n' \
            '68fd45809d1a2cad5c855e58a20c62cfaf1236d609d3af8e28d68d72ea105558' \
            '/tmp/cgo27-final-payload.tar.gz' \
            | sha256sum --check --strict -

          if tar --list --gzip --file /tmp/cgo27-final-payload.tar.gz | grep -q '^\.github/workflows/'; then
            echo 'payload unexpectedly contains workflow files' >&2
            exit 1
          fi

          tar --extract --gzip --file /tmp/cgo27-final-payload.tar.gz --directory .
          rm -rf .cgo27-final-payload

          git add --all
          git diff --cached --check
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --cached --name-only -- '.github/workflows/*')"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(cgo27): complete ablation, historical, and paper hardening'
          git push origin HEAD:${WORK_BRANCH}
