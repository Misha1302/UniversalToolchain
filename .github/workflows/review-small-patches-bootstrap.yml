name: Review small patches bootstrap

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/review-small-patches-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-ten-findings-20260730
          fetch-depth: 0
      - name: Apply focused follow-up patches
        shell: python
        run: |
          from pathlib import Path
          import json

          test_file = Path('UniversalToolchain/Tests/Internal/ModuleContracts/PipelineEffectVerifierTests.cs')
          text = test_file.read_text(encoding='utf-8-sig')
          old = 'new CompilerFactState([customFact], [])'
          new = 'new CompilerFactState(\n                new HashSet<CompilerFactId> { customFact },\n                new HashSet<CompilerFactId>())'
          if text.count(old) != 1:
              raise SystemExit(f'custom fact state anchors: {text.count(old)}')
          test_file.write_text(text.replace(old, new, 1), encoding='utf-8')

          observer = Path('UniversalToolchain/UniversalToolchain.ModuleContracts/ModuleContractPipelineObserver.cs')
          text = observer.read_text(encoding='utf-8-sig')
          old = '''        return frontendModules
              .Cast<object>()
              .Concat(optimizers)
              .SelectMany(SelectedModuleContractTableProvider.ReadSelectedModuleIds)
              .Concat(backendComponents
                  .OfType<IModuleContractBackendPipelineComponent>()
                  .SelectMany(SelectedModuleContractTableProvider.ReadSelectedBackendModuleIds))
              .Concat([
                  KnownCoreModuleIds.CompilerFacts,
                  KnownCoreModuleIds.BackendCapabilities
              ])
              .ToArray();'''
          new = '''        var order = frontendModules
              .Cast<object>()
              .Concat(optimizers)
              .SelectMany(SelectedModuleContractTableProvider.ReadSelectedModuleIds)
              .Concat(backendComponents
                  .OfType<IModuleContractBackendPipelineComponent>()
                  .SelectMany(SelectedModuleContractTableProvider.ReadSelectedBackendModuleIds))
              .ToList();
          if (!order.Contains(KnownCoreModuleIds.CompilerFacts))
              order.Add(KnownCoreModuleIds.CompilerFacts);
          if (!order.Contains(KnownCoreModuleIds.BackendCapabilities))
              order.Add(KnownCoreModuleIds.BackendCapabilities);
          return order;'''
          if text.count(old) != 1:
              raise SystemExit(f'pipeline order anchors: {text.count(old)}')
          observer.write_text(text.replace(old, new, 1), encoding='utf-8')

          manifest_path = Path('eng/test-counts.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          by_label = {entry['label']: entry for entry in manifest['main']}
          by_label['Core']['expectedPassed'] = 512
          by_label['LanguageSdk']['expectedPassed'] = 82
          manifest['totalPassed'] = 1551
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

      - name: Remove temporary files and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/review-small-patches-bootstrap.yml
          git rm -f \
            internal-docs/reviews/.gitkeep \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.status \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.note \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.todo \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.scope \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.stop-condition \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.acceptance \
            internal-docs/reviews/review-ten-findings-remediation-2026-07-30.authority
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UniversalToolchain/Tests/Internal/ModuleContracts/PipelineEffectVerifierTests.cs \
                  UniversalToolchain/UniversalToolchain.ModuleContracts/ModuleContractPipelineObserver.cs \
                  eng/test-counts.json
          git commit -m "contracts: complete focused review hardening"
          git push origin HEAD:fix/review-ten-findings-20260730
