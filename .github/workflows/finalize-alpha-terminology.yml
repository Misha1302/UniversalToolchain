name: Finalize alpha terminology manifest

on:
  push:
    branches:
      - docs-alpha-terminology-20260715
    paths:
      - .github/workflows/finalize-alpha-terminology.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-alpha-terminology-20260715
      - name: Validate docs and regenerate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/check_documentation_status.py
          find . -type f \
            ! -path './.git/*' \
            ! -path './MANIFEST.sha256' \
            ! -path './alpha-terminology-report.txt' \
            ! -path './alpha-migration.log' \
            ! -path './Tools/apply_alpha_terminology.py' \
            ! -path './.github/workflows/audit-alpha-terminology.yml' \
            ! -path './.github/workflows/apply-alpha-terminology.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v2.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v3.yml' \
            ! -path './.github/workflows/apply-alpha-terminology-v4.yml' \
            ! -path './.github/workflows/run-alpha-migrator.yml' \
            ! -path './.github/workflows/finalize-alpha-terminology.yml' \
            -print0 | sort -z | xargs -0 sha256sum > MANIFEST.sha256
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANIFEST.sha256
          if git diff --cached --quiet; then
            echo 'Manifest already current.'
            exit 0
          fi
          git commit -m 'chore: refresh alpha terminology manifest'
          git push origin HEAD:docs-alpha-terminology-20260715
