name: Refresh route report invariant manifest once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Regenerate tracked-file manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-route-report-manifest-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit manifest when changed
        shell: bash
        run: |
          if git diff --quiet -- MANIFEST.sha256; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add MANIFEST.sha256
          git commit -m "chore: refresh source manifest for route report invariants"
          git push origin "HEAD:${{ github.head_ref }}"
