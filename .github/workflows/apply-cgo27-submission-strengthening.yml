name: Apply CGO27 Submission Strengthening

on:
  push:
    branches:
      - research/cgo27-submission-strengthening
    paths:
      - ".github/workflows/apply-cgo27-submission-strengthening.yml"
      - ".github/patches/cgo27-submission-strengthening.patch.gz.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: research/cgo27-submission-strengthening
          fetch-depth: 0

      - name: Verify bootstrap ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~2)" = "f13ad1310856e5618e1c3042c447ca543e0f3125"
          test -f .github/patches/cgo27-submission-strengthening.patch.gz.b64

      - name: Apply exact patch and validate scope
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/patches/cgo27-submission-strengthening.patch.gz.b64 \
            | gzip -d > /tmp/cgo27-strengthening.patch
          git apply --check /tmp/cgo27-strengthening.patch
          git apply /tmp/cgo27-strengthening.patch

          cat > /tmp/expected-paths <<'PATHS'
          .github/workflows/cgo27-ablations.yml
          .github/workflows/cgo27-artifact.yml
          .github/workflows/cgo27-end-to-end.yml
          .github/workflows/cgo27-submission.yml
          CGO27/00_WORKSTATE.md
          CGO27/DEVIATION_LEDGER.md
          CGO27/RESULTS_SUMMARY.md
          CGO27/REVIEW_FINDINGS.md
          CGO27/artifact/EXPECTED_RESULTS.md
          CGO27/paper/README.md
          CGO27/paper/main.tex
          CGO27/paper/sections/01-introduction.tex
          CGO27/paper/sections/02-problem.tex
          CGO27/paper/sections/03-design.tex
          CGO27/paper/sections/04-implementation.tex
          CGO27/paper/sections/05-methodology.tex
          CGO27/paper/sections/06-results.tex
          CGO27/paper/sections/07-ablation.tex
          CGO27/paper/sections/08-related-work.tex
          CGO27/paper/sections/09-threats.tex
          CGO27/paper/sections/10-conclusion.tex
          CGO27/submission/ANONYMIZATION.md
          CGO27/submission/README.md
          CGO27/submission/sanitize_submission_tree.py
          CGO27/submission/validate_anonymous_source.py
          CGO27/submission/verify_anonymous_bundle.sh
          Tools/finalize-cgo27-anonymous-supplement.sh
          Tools/prepare-cgo27-anonymous-supplement.sh
          Tools/run-contract-experiment.sh
          UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/Cgo27Program.Core.cs
          UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/Cgo27Program.DemandBaseline.cs
          UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/Cgo27Program.Performance.cs
          UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/VerificationPolicyScheduler.cs
          UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/VerificationPolicySchedulerTests.cs
          UniversalToolchain/Experiments/UniversalToolchain.EndToEndExperiments/run_matrix_v2.py
          UniversalToolchain/NativeMathModule/NativeArithmeticAstVisitor.cs
          PATHS

          git diff --name-only | sort > /tmp/actual-paths
          diff -u /tmp/expected-paths /tmp/actual-paths

      - name: Commit strengthened submission
        shell: bash
        run: |
          set -euo pipefail
          rm .github/patches/cgo27-submission-strengthening.patch.gz.b64
          rm .github/workflows/apply-cgo27-submission-strengthening.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen CGO27 submission model and anonymity"
          git push origin HEAD:research/cgo27-submission-strengthening
