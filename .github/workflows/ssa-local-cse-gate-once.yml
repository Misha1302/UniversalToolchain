name: Gate local CSE from AIR profile once

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  gate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply route gate and refresh manifest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import pathlib
          import subprocess

          def replace_once(path, old, new):
              file = pathlib.Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count == 0:
                  if new in text:
                      return
                  raise SystemExit(f'Expected marker missing in {path}: {old!r}')
              if count != 1:
                  raise SystemExit(f'Expected one marker in {path}, found {count}: {old!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRouteProfile.cs',
              '        new SsaLocalCommonSubexpressionEliminationPass(SemanticDescriptors),\n',
              '')

          replace_once(
              'docs/architecture/ssa-coverage-matrix.md',
              '| Local common-subexpression elimination | Supported for trusted deterministic pure expressions within one block | local CSE safety and substitution regressions |',
              '| Local common-subexpression elimination | Explicit SSA pass only; gated from the preview AIR roundtrip until repeated-value scheduling is supported | local CSE safety, substitution, and profile-gate regressions |')

          excluded = {
              'MANIFEST.sha256',
              '.github/workflows/ssa-local-cse-gate-once.yml',
          }
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          lines = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8')
              if path in excluded:
                  continue
              digest = hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}\n')
          pathlib.Path('MANIFEST.sha256').write_text(''.join(lines), encoding='utf-8')
          PY

      - name: Commit gated integration when changed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRouteProfile.cs \
            docs/architecture/ssa-coverage-matrix.md \
            MANIFEST.sha256
          git commit -m "ssa: gate local CSE from preview AIR route"
          git push origin "HEAD:${{ github.head_ref }}"
