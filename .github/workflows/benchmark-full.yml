name: Benchmark Full

on:
  workflow_dispatch:
    inputs:
      filter:
        description: "BenchmarkDotNet filter"
        required: false
        default: "*External*ExecutionBenchmarks"

jobs:
  benchmark-full:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Restore
        run: dotnet restore UniversalToolchain/Wist.sln

      - name: Build
        run: dotnet build UniversalToolchain/Wist.sln -c Release --no-restore

      - name: Run benchmarks
        run: >
          dotnet run -c Release
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --filter "${{ inputs.filter }}"

      - name: Upload BenchmarkDotNet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmarkdotnet-artifacts
          path: BenchmarkDotNet.Artifacts
          if-no-files-found: warn
