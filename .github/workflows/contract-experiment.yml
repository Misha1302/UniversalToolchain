name: Contract Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "UniversalToolchain/Experiments/UniversalToolchain.ContractExperiments/**"
      - "UniversalToolchain/Experiments/UniversalToolchain.ContractReviewHoldouts/**"
      - "UniversalToolchain/UniversalToolchain.ModuleContracts/**"
      - "UniversalToolchain/IntermediateRepresentationAbstractions/**"
      - "UniversalToolchain/UniversalToolchain.Dialects.Wist/**"
      - "UniversalToolchain/Wistc/**"
      - "UniversalToolchain/Dialects/examples/wist/function-calls-safe-math/**"
      - "Tools/run-contract-experiment.sh"
      - "Tools/run-contract-review-holdout.sh"
      - ".github/workflows/contract-experiment.yml"

jobs:
  contract-experiment:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Verify selected SafeMath capability surface
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p UniversalToolchain/packages
          output="$(dotnet run --project UniversalToolchain/Wistc/Wistc.csproj -- \
            features \
            --dialect-file UniversalToolchain/Dialects/examples/wist/function-calls-safe-math/dialect.wistdialect)"
          printf '%s\n' "$output"
          grep -Fq 'Available features:' <<<"$output"
          grep -Fq 'SafeMathFunctions' <<<"$output"
          grep -Fq 'Available functions: abs, clamp, max, min, round' <<<"$output"

      - name: Run production-boundary contract study
        env:
          CONTRACT_EXPERIMENT_REPLICATES: 5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract-experiment
          ./Tools/run-contract-experiment.sh artifacts/contract-experiment 2>&1 \
            | tee artifacts/contract-experiment-workflow.log

      - name: Run post-freeze review holdouts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/contract-review-holdout
          bash ./Tools/run-contract-review-holdout.sh artifacts/contract-review-holdout 2>&1 \
            | tee artifacts/contract-review-holdout-workflow.log

      - name: Upload contract experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-experiment-${{ github.sha }}
          path: |
            artifacts/contract-experiment
            artifacts/contract-experiment-workflow.log
            artifacts/contract-review-holdout
            artifacts/contract-review-holdout-workflow.log
          if-no-files-found: error
          retention-days: 90
