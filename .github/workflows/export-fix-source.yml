name: Apply verified PlanFuzz regression repair

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply verified repair patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/repair/planfuzz-regressions.patch.gz.b64 \
            | gzip --decompress \
            > "$RUNNER_TEMP/planfuzz-regressions.patch"
          git apply --check "$RUNNER_TEMP/planfuzz-regressions.patch"
          git apply "$RUNNER_TEMP/planfuzz-regressions.patch"
          rm .github/repair/planfuzz-regressions.patch.gz.b64
          rmdir .github/repair
          rm .github/workflows/export-fix-source.yml
          git add -A

      - name: Refresh recursive source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  source = Path(path)
                  if source.exists():
                      output.write(f"{sha256(source.read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git add MANIFEST.sha256
          git diff --cached --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(wist): repair PlanFuzz regressions"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
