name: Benchmark Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "UniversalToolchain/Benchmarks/**"
      - "UniversalToolchain/UniversalToolchain.Dialects.Wist/**"
      - "UniversalToolchain/DynamicMethodCalling/**"
      - "UniversalToolchain/UniversalToolchain.Modules.Tests/**"
      - ".github/workflows/benchmark-smoke.yml"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Restore
        run: dotnet restore UniversalToolchain/Wist.sln

      - name: Build
        run: dotnet build UniversalToolchain/Wist.sln -c Release --no-restore

      - name: Benchmark contract tests
        run: dotnet test UniversalToolchain/UniversalToolchain.Modules.Tests/UniversalToolchain.Modules.Tests.csproj -c Release --no-build --filter "FullyQualifiedName~BenchmarkContractTests"

      - name: Hot execution dry smoke
        run: >
          dotnet run -c Release
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --job dry
          --filter "*ExternalSimple3*"
