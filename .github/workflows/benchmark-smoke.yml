name: Benchmark Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "UniversalToolchain/Benchmarks/**"
      - "UniversalToolchain/UniversalToolchain.Wist/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.Wist/**/*.csproj"
      - "UniversalToolchain/UniversalToolchain.LanguageSdk/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.LanguageSdk/**/*.csproj"
      - "UniversalToolchain/UniversalToolchain.Runtime/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.Runtime/**/*.csproj"
      - "UniversalToolchain/UniversalToolchain.FeatureSdk/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.FeatureSdk/**/*.csproj"
      - "UniversalToolchain/UniversalToolchain.Language.Abstractions/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.Language.Abstractions/**/*.csproj"
      - "UniversalToolchain/UniversalToolchain.Wist.LanguagePack/**/*.cs"
      - "UniversalToolchain/UniversalToolchain.Wist.LanguagePack/**/*.csproj"
      - ".github/workflows/benchmark-smoke.yml"
      - "global.json"

jobs:
  benchmark-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          global-json-file: global.json

      - name: Prepare optional repository-local feed
        run: mkdir -p UniversalToolchain/packages

      - name: Restore benchmark project
        run: dotnet restore UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj -p:NuGetAudit=false

      - name: Build benchmark project
        run: dotnet build UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj -c Release --no-restore -p:NuGetAudit=false

      - name: Benchmark self-test
        run: >
          dotnet run -c Release --no-build
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --self-test

      - name: Architecture boundary dry run
        run: >
          dotnet run -c Release --no-build
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --job dry
          --filter "*MigrationArchitectureBoundaryBenchmarks*"

      - name: Compilation boundary dry run
        run: >
          dotnet run -c Release --no-build
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --job dry
          --filter "*FormulaCompilationBenchmarks*"

      - name: Convenience Evaluate dry run
        run: >
          dotnet run -c Release --no-build
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --job dry
          --filter "*FormulaConvenienceBenchmarks*"

      - name: Hot invocation dry run
        run: >
          dotnet run -c Release --no-build
          --project UniversalToolchain/Benchmarks/UniversalToolchain.Benchmarks/UniversalToolchain.Benchmarks.csproj
          --
          --job dry
          --filter "*FormulaHotPathBenchmarks*"
