name: Apply verified PlanFuzz surface hardening on PR

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-surface-hardening
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/planfuzz-surface-hardening-patch/chunk* > "$RUNNER_TEMP/hardening.patch.gz.b64"
          echo '59232208ea2dc1a7102bca457224cfeeea447caea7472185d838540aa576d74e  '"$RUNNER_TEMP/hardening.patch.gz.b64" | sha256sum --check
          base64 --decode "$RUNNER_TEMP/hardening.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/hardening.patch"
          echo 'c576024ef868e7bf04efe90af97c84f8eb94c065323168e169170cb21de0057d  '"$RUNNER_TEMP/hardening.patch" | sha256sum --check

      - name: Apply implementation
        shell: bash
        run: patch -p1 --batch --forward < "$RUNNER_TEMP/hardening.patch"

      - name: Remove transport files
        shell: bash
        run: git rm -r .github/planfuzz-surface-hardening-patch .github/workflows/apply-planfuzz-surface-hardening.yml .github/workflows/apply-planfuzz-surface-hardening-pr.yml .github/workflows/diagnose-planfuzz-surface-hardening.yml .github/planfuzz-surface-hardening-trigger

      - name: Refresh recursive source manifest
        shell: bash
        run: |
          git add -A
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "--cached", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git add MANIFEST.sha256
          git diff --cached --check

      - name: Commit hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(research): harden PlanFuzz surface evidence'
          git push origin HEAD:research/planfuzz-surface-hardening
