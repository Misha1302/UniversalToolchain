name: Apply verified PlanFuzz surface oracles

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-surface-oracles:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout surface-oracle branch
        uses: actions/checkout@v4
        with:
          ref: research/planfuzz-surface-oracles
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          cat .github/planfuzz-surface-patch/chunk* > "$RUNNER_TEMP/surface.patch.gz.b64"
          base64 --decode "$RUNNER_TEMP/surface.patch.gz.b64" | gzip --decompress > "$RUNNER_TEMP/surface.patch"
          echo 'e4b96d49ee41186fe5fc93750fac3afab8d616e392271e7421f372fbe8b9f202  '"$RUNNER_TEMP/surface.patch" | sha256sum --check

      - name: Apply surface-oracle implementation
        shell: bash
        run: patch -p1 --forward < "$RUNNER_TEMP/surface.patch"

      - name: Remove transport files
        shell: bash
        run: git rm -r .github/planfuzz-surface-patch .github/workflows/apply-planfuzz-surface-oracles.yml

      - name: Refresh recursive source manifest
        shell: bash
        run: |
          git add -A
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import subprocess

          paths = subprocess.check_output(["git", "ls-files", "--cached", "-z"]).split(b"\0")
          with Path("MANIFEST.sha256").open("w", encoding="utf-8", newline="\n") as output:
              for raw_path in sorted(path for path in paths if path and path != b"MANIFEST.sha256"):
                  path = raw_path.decode("utf-8")
                  output.write(f"{sha256(Path(path).read_bytes()).hexdigest()}  ./{path}\n")
          PY
          git add MANIFEST.sha256
          git diff --cached --check

      - name: Commit surface oracles
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(research): add PlanFuzz surface oracles'
          git push origin HEAD:research/planfuzz-surface-oracles
