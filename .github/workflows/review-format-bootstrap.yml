name: Review formatting bootstrap

on:
  pull_request:
    branches:
      - master
    paths:
      - .github/workflows/review-format-bootstrap.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-ten-findings-20260730
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json
      - name: Restore and format touched C# files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p UniversalToolchain/packages
          unset PLATFORM || true
          dotnet restore UniversalToolchain/Wist.sln -p:NuGetAudit=false
          dotnet format whitespace UniversalToolchain/Wist.sln \
            --no-restore \
            --include \
              UniversalToolchain/UniversalToolchain.Runtime/RuntimeContracts.cs \
              UniversalToolchain/UniversalToolchain.LanguageSdk.Tests/RuntimeLifecycleAndCanonicalizationTests.cs
      - name: Remove bootstrap workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/review-format-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add UniversalToolchain/UniversalToolchain.Runtime/RuntimeContracts.cs \
                  UniversalToolchain/UniversalToolchain.LanguageSdk.Tests/RuntimeLifecycleAndCanonicalizationTests.cs
          git commit -m "style: format runtime remediation changes"
          git push origin HEAD:fix/review-ten-findings-20260730
