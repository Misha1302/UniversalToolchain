name: Temporary SSA clean rebase

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current-master repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ssa-route-execution-contracts-20260715-v2
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply verified diff, test, and self-clean
        shell: bash
        run: |
          set -Eeuo pipefail

          old_parent=d4e38f6449fd9ae18aea24b3d745a6d0021f7e36
          verified_commit=8f0273e718c765fcab571e08da063c37b13bfb37
          formatted_test_commit=3a8072e3bd0f9aaf76cb5b993dc7c717022cf785
          workflow=.github/workflows/temporary-ssa-clean-rebase.yml

          git diff --binary "$old_parent" "$verified_commit" -- \
            UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaOptimizerPipeline.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRoundtripRoute.cs \
            UniversalToolchain/UniversalToolchain.Ssa.Optimization/SsaRouteProfile.cs \
            > /tmp/ssa-production.patch

          git apply --3way --index /tmp/ssa-production.patch
          git show "$formatted_test_commit:UniversalToolchain/Tests/Ssa/SsaRouteOperationalContractTests.cs" \
            > UniversalToolchain/Tests/Ssa/SsaRouteOperationalContractTests.cs
          git add UniversalToolchain/Tests/Ssa/SsaRouteOperationalContractTests.cs

          rm -f "$workflow"
          git add -A

          python3 <<'PY'
          from __future__ import annotations

          import hashlib
          import os
          import subprocess
          from pathlib import Path

          manifest = Path('MANIFEST.sha256')
          paths = []
          for raw in subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0'):
              if not raw:
                  continue
              path = os.fsdecode(raw)
              if path == manifest.as_posix():
                  continue
              file_path = Path(path)
              if not file_path.is_file():
                  raise SystemExit(f'Git index contains missing file: {path}')
              paths.append(path)

          lines = []
          for path in sorted(paths):
              digest = hashlib.sha256(Path(path).read_bytes()).hexdigest()
              lines.append(f'{digest}  ./{path}')

          manifest.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(f'MANIFEST.sha256 entries: {len(lines)}')
          PY

          git add MANIFEST.sha256
          sha256sum --check MANIFEST.sha256
          git diff --cached --check

          dotnet test UniversalToolchain/Tests/Tests.csproj \
            -c Release \
            --filter 'FullyQualifiedName~SsaRouteOperationalContractTests' \
            --logger 'console;verbosity=normal'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ssa: harden route execution contracts'
          git push origin HEAD:fix/ssa-route-execution-contracts-20260715-v2
