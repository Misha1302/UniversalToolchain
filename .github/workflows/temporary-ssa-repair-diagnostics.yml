name: Temporary SSA repair diagnostics

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  diagnose-repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/ssa-route-execution-contracts-20260715
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract and run bootstrap
        id: repair
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 <<'PY'
          from pathlib import Path
          import base64, gzip, re

          workflow = Path('.github/workflows/temporary-ssa-execution-contract-repair.yml').read_text(encoding='utf-8')
          match = re.search(r'^\s*BOOTSTRAP_GZIP_BASE64:\s*(\S+)\s*$', workflow, re.MULTILINE)
          if match is None:
              raise SystemExit('BOOTSTRAP_GZIP_BASE64 not found')
          script = gzip.decompress(base64.b64decode(match.group(1))).decode('utf-8')

          using_needle = 'using UniversalToolchain.Ssa.Core;\nusing UniversalToolchain.Ssa.Optimization;'
          using_replacement = 'using UniversalToolchain.Ssa.Core;\nusing UniversalToolchain.Ssa.Emission;\nusing UniversalToolchain.Ssa.Optimization;'
          if using_needle not in script:
              raise SystemExit('test using insertion point not found in bootstrap')
          script = script.replace(using_needle, using_replacement, 1)

          emitter_patch = r"""
          python3 <<'PY_EMITTER'
          from pathlib import Path

          path = Path('UniversalToolchain/UniversalToolchain.Ssa.Emission/SsaToAirConverter.cs')
          text = path.read_text(encoding='utf-8')

          old = '''        var stack = block.Parameters.Select(static x => x.Value.Id).ToList();
                  foreach (var instruction in block.Instructions)'''
          new = '''        var stack = block.Parameters.Select(static x => x.Value.Id).ToList();
                  DropUnusedTrailingBlockParameters(air, state, stack);
                  foreach (var instruction in block.Instructions)'''
          if old not in text:
              raise SystemExit('EmitBlock stack initialization anchor not found')
          text = text.replace(old, new, 1)

          operation_anchor = '''    private static void EmitOperation(
                  AbstractIR air,'''
          helper = '''    private static void DropUnusedTrailingBlockParameters(
                  AbstractIR air,
                  EmissionState state,
                  List<SsaValueId> stack)
              {
                  while (stack.Count > 0 && state.IsUnused(stack[^1]))
                  {
                      air.Drop();
                      stack.RemoveAt(stack.Count - 1);
                  }
              }

          '''
          if operation_anchor not in text:
              raise SystemExit('EmitOperation insertion anchor not found')
          text = text.replace(operation_anchor, helper + operation_anchor, 1)

          state_anchor = '        public bool IsUnusedPureResult(SsaOperation operation) =>'
          state_replacement = '''        public bool IsUnused(SsaValueId valueId) => !_useCounts.ContainsKey(valueId);

                  public bool IsUnusedPureResult(SsaOperation operation) =>'''
          if state_anchor not in text:
              raise SystemExit('EmissionState unused-value insertion anchor not found')
          text = text.replace(state_anchor, state_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY_EMITTER
          """
          script_anchor = 'set -Eeuo pipefail\n'
          if script_anchor not in script:
              raise SystemExit('bootstrap shell strict-mode anchor not found')
          script = script.replace(script_anchor, script_anchor + emitter_patch, 1)

          marker = 'git add -A'
          if marker not in script:
              raise SystemExit('git add marker not found in bootstrap')
          script = script.replace(
              marker,
              "rm -f .github/workflows/temporary-ssa-repair-diagnostics.yml\n" + marker,
              1,
          )
          Path('/tmp/ssa-bootstrap.sh').write_text(script, encoding='utf-8')
          PY
          chmod +x /tmp/ssa-bootstrap.sh
          set +e
          /tmp/ssa-bootstrap.sh > /tmp/ssa-bootstrap.log 2>&1
          status=$?
          set -e
          cat /tmp/ssa-bootstrap.log
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload complete repair log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssa-repair-diagnostics
          path: /tmp/ssa-bootstrap.log
          if-no-files-found: error

      - name: Enforce repair success
        if: always()
        shell: bash
        run: |
          test "${{ steps.repair.outputs.status }}" = "0"
