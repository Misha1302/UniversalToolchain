name: Audit alpha terminology

on:
  push:
    branches:
      - docs-alpha-terminology-20260715
    paths:
      - .github/workflows/audit-alpha-terminology.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs-alpha-terminology-20260715
      - name: Collect preview occurrences
        shell: bash
        run: |
          set -euo pipefail
          git grep -n -i -- 'preview' -- \
            '*.md' '*.txt' '*.json' '*.yml' '*.yaml' '*.py' '*.csproj' '*.cs' \
            > alpha-terminology-report.txt || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add alpha-terminology-report.txt
          git commit -m 'chore: record preview terminology audit'
          git push origin HEAD:docs-alpha-terminology-20260715
