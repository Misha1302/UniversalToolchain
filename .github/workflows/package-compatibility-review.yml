name: Package Compatibility Review

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
    paths:
      - ".github/workflows/package-compatibility-review.yml"
      - "build.sh"
      - "eng/package-projects.txt"
      - "eng/package-release-baseline.json"
      - "eng/wist-api-baseline.json"
      - "eng/wist-public-api-baseline.txt"
      - "eng/wist-api-compatibility.csv"
      - "eng/wist-api-deltas.csv"
      - "Tools/check-package-version-provenance.py"
      - "Tools/check-wist-api-compatibility.py"
      - "Tools/package_metadata.py"
      - "Tools/test-package-metadata-mutants.py"
      - "VERIFICATION.md"
      - "RELEASE_NOTES_RU.md"
      - "docs/evidence/current-verification.md"
      - "docs/evidence/maintainer-guide.md"
      - "UniversalToolchain/UniversalToolchain.Dialects.Tests/**"
      - "UniversalToolchain/UniversalToolchain.FeatureSdk/**"
      - "UniversalToolchain/UniversalToolchain.Language.Abstractions/**"
      - "UniversalToolchain/UniversalToolchain.LanguageAuthoring/**"
      - "UniversalToolchain/UniversalToolchain.LanguageSdk/**"
      - "UniversalToolchain/UniversalToolchain.Testing/**"
      - "UniversalToolchain/UniversalToolchain.Templates/**"
      - "UniversalToolchain/UniversalToolchain.Wist/**"
      - "UniversalToolchain/UniversalToolchain.Wist.LanguagePack/**"
      - "UniversalToolchain/UniversalToolchain.Ssa.Abstractions/**"
      - "UniversalToolchain/UniversalToolchain.Ssa.Optimization/**"
      - "UniversalToolchain/UniversalToolchain.Runtime/**"
      - "UniversalToolchain/UniversalToolchain.ModuleContracts/**"
      - "UniversalToolchain/UniversalToolchain.LanguageSdk.Tests/**"
      - "UniversalToolchain/Tests/**"

permissions:
  contents: read

jobs:
  package-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      REVIEW_BASE_SHA: f13ad1310856e5618e1c3042c447ca543e0f3125
      REVIEW_BASE_SOURCE_NAME: Wist-review-baseline-f13ad131.zip
      REVIEW_BASE_PACKAGES_NAME: UniversalToolchain-review-packages-f13ad131.zip

    steps:
      - name: Checkout review revision with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json

      - name: Build deterministic reviewed previous baseline
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD"
          evidence="$root/artifacts/package-review"
          previous_root="$RUNNER_TEMP/wist-previous"
          previous_packages="$evidence/previous-packages"
          source_archive="$evidence/$REVIEW_BASE_SOURCE_NAME"
          package_bundle="$evidence/$REVIEW_BASE_PACKAGES_NAME"
          rm -rf "$evidence" "$previous_root"
          mkdir -p "$evidence" "$previous_packages"

          git archive --format=zip --output="$source_archive" "$REVIEW_BASE_SHA"
          git worktree add --detach "$previous_root" "$REVIEW_BASE_SHA"
          mkdir -p "$previous_root/UniversalToolchain/packages"
          unset PLATFORM || true

          mapfile -t projects < <(sed -e 's/[[:space:]]*$//' -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' "$previous_root/eng/package-projects.txt")
          for project in "${projects[@]}"; do
            dotnet restore "$previous_root/$project" -p:NuGetAudit=false
          done
          for project in "${projects[@]}"; do
            dotnet pack "$previous_root/$project" \
              -c Release \
              --no-restore \
              -o "$previous_packages" \
              /p:WarningsAsErrors=NU5118 \
              -p:NuGetAudit=false
          done
          mapfile -t archives < <(find "$previous_packages" -maxdepth 1 -type f \( -name '*.nupkg' -o -name '*.snupkg' \) -print | sort)
          python3 "$previous_root/Tools/repack-nupkg-deterministic.py" "${archives[@]}"

          PREVIOUS_PACKAGES="$previous_packages" PACKAGE_BUNDLE="$package_bundle" python3 - <<'PY'
          from pathlib import Path
          import os
          import zipfile

          source = Path(os.environ["PREVIOUS_PACKAGES"])
          output = Path(os.environ["PACKAGE_BUNDLE"])
          files = sorted(path for path in source.iterdir() if path.suffix == ".nupkg")
          if not files:
              raise SystemExit("previous package set is empty")
          with zipfile.ZipFile(output, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  info = zipfile.ZipInfo(path.name, (1980, 1, 1, 0, 0, 0))
                  info.compress_type = zipfile.ZIP_DEFLATED
                  info.external_attr = 0o100644 << 16
                  archive.writestr(info, path.read_bytes())
          PY

          source_sha="$(sha256sum "$source_archive" | awk '{print $1}')"
          package_sha="$(sha256sum "$package_bundle" | awk '{print $1}')"
          printf '%s  %s\n' "$source_sha" "$(basename "$source_archive")" > "$evidence/BASELINE-SHA256SUMS"
          printf '%s  %s\n' "$package_sha" "$(basename "$package_bundle")" >> "$evidence/BASELINE-SHA256SUMS"
          printf '%s\n' "$REVIEW_BASE_SHA" > "$evidence/BASELINE-COMMIT"
          (cd "$evidence" && sha256sum -c BASELINE-SHA256SUMS)

          SOURCE_ARCHIVE="$source_archive" PACKAGE_BUNDLE="$package_bundle" python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          source = Path(os.environ["SOURCE_ARCHIVE"])
          packages = Path(os.environ["PACKAGE_BUNDLE"])
          def digest(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          Path("eng/package-release-baseline.json").write_text(json.dumps({
              "schemaVersion": 1,
              "previousBundleFileName": packages.name,
              "previousBundleSha256": digest(packages),
              "reviewedSourceCommit": os.environ["REVIEW_BASE_SHA"],
          }, indent=2) + "\n", encoding="utf-8")

          api_path = Path("eng/wist-api-baseline.json")
          api = json.loads(api_path.read_text(encoding="utf-8"))
          api["baselineSourceArchive"] = source.name
          api["baselineSourceArchiveSha256"] = digest(source)
          api["baselineSourceCommit"] = os.environ["REVIEW_BASE_SHA"]
          api_path.write_text(json.dumps(api, indent=2) + "\n", encoding="utf-8")
          PY

          git worktree remove "$previous_root" --force

      - name: Run canonical baseline-bearing package gate
        shell: bash
        run: |
          set -euo pipefail
          source_archive="$PWD/artifacts/package-review/$REVIEW_BASE_SOURCE_NAME"
          package_bundle="$PWD/artifacts/package-review/$REVIEW_BASE_PACKAGES_NAME"
          ./build.sh --skip-docs \
            --baseline-source-archive "$source_archive" \
            --previous-package-bundle "$package_bundle" 2>&1 \
            | tee artifacts/package-review/package-gate.log

      - name: Capture current package evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$PWD/artifacts/package-review"
          if [[ -d artifacts/packages ]]; then
            mkdir -p "$evidence/current-packages"
            cp -a artifacts/packages/. "$evidence/current-packages/"
          fi
          if [[ -f artifacts/RELEASE-INTEGRITY.json ]]; then
            cp artifacts/RELEASE-INTEGRITY.json "$evidence/"
          fi
          if [[ -f artifacts/RELEASE-INTEGRITY.root.sha256 ]]; then
            cp artifacts/RELEASE-INTEGRITY.root.sha256 "$evidence/"
          fi
          if [[ -f artifacts/package-metadata-report.json ]]; then
            cp artifacts/package-metadata-report.json "$evidence/"
          fi
          find "$evidence" -type f ! -name MANIFEST.sha256 -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            > "$evidence/MANIFEST.sha256"
          (cd "$evidence" && sha256sum -c MANIFEST.sha256)

      - name: Upload package compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: package-compatibility-review-${{ github.sha }}
          path: artifacts/package-review
          if-no-files-found: error
          retention-days: 90
