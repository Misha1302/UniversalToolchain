name: Wist Admin Finalization via PR

on:
  pull_request:
    branches: [ master ]
    types: [ opened ]
    paths:
      - '.github/wist-admin-trigger.txt'

permissions:
  contents: read

jobs:
  finalize:
    if: github.actor == 'Misha1302' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: ${{ secrets.WIST_ADMIN_TOKEN }}
      OWNER: Misha1302
      ACTIVE_REPO: Wist2
      RESULT_PATH: docs/maintainers/.wist-admin-finalization-result.json
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate administrative token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ADMIN_TOKEN:-}" ]]; then
            echo 'Repository secret WIST_ADMIN_TOKEN is missing or empty.' >&2
            exit 1
          fi
          status="$(curl -sS -o /tmp/user.json -w '%{http_code}' \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/user)"
          if [[ "$status" != '200' ]]; then
            echo "WIST_ADMIN_TOKEN was rejected by GitHub (HTTP ${status})." >&2
            exit 1
          fi
          jq -e '.login == "Misha1302"' /tmp/user.json >/dev/null

      - name: Render and validate canonical social-preview PNG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-bin >/dev/null
          rsvg-convert \
            --width 1280 \
            --height 640 \
            --output docs/assets/wist-social-preview.png \
            docs/assets/wist-social-preview.svg
          python3 - <<'PY'
          import pathlib
          import struct

          path = pathlib.Path('docs/assets/wist-social-preview.png')
          data = path.read_bytes()
          if data[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('Rendered file does not have a PNG signature')
          width, height = struct.unpack('>II', data[16:24])
          if (width, height) != (1280, 640):
              raise SystemExit(f'Unexpected PNG dimensions: {width}x{height}')
          if len(data) < 10_000:
              raise SystemExit(f'Rendered PNG is suspiciously small: {len(data)} bytes')
          print(f'Validated PNG: {width}x{height}, {len(data)} bytes')
          PY

      - name: Apply and verify repository finalization
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            local data="${3-}"
            local args=(
              -fsS --retry 3 --retry-all-errors
              -X "$method"
              -H "Authorization: Bearer ${ADMIN_TOKEN}"
              -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then
              args+=(-H 'Content-Type: application/json' --data "$data")
            fi
            curl "${args[@]}" "https://api.github.com${path}"
          }

          upsert_file() {
            local path="$1"
            local source="$2"
            local message="$3"
            local content current sha payload
            content="$(base64 -w0 "$source")"
            if current="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/contents/${path}?ref=master" 2>/dev/null)"; then
              sha="$(jq -er '.sha' <<<"$current")"
              payload="$(jq -nc --arg message "$message" --arg content "$content" --arg sha "$sha" --arg branch master \
                '{message: $message, content: $content, sha: $sha, branch: $branch}')"
            else
              payload="$(jq -nc --arg message "$message" --arg content "$content" --arg branch master \
                '{message: $message, content: $content, branch: $branch}')"
            fi
            api PUT "/repos/${OWNER}/${ACTIVE_REPO}/contents/${path}" "$payload" >/dev/null
          }

          description='Restricted formulas for .NET: validate rules and compile approved formulas into typed delegates.'
          homepage='https://misha1302.github.io/Wist2/'

          repo_payload="$(jq -nc \
            --arg description "$description" \
            --arg homepage "$homepage" \
            '{description: $description, homepage: $homepage}')"
          api PATCH "/repos/${OWNER}/${ACTIVE_REPO}" "$repo_payload" >/dev/null

          topics_payload='{"names":["dotnet","csharp","rule-engine","expression-engine","embedded-dsl","business-rules","compiler","interpreter","cil","runtime","language-tooling","ssa"]}'
          api PUT "/repos/${OWNER}/${ACTIVE_REPO}/topics" "$topics_payload" >/dev/null

          for repo in Wist Wist4 Wist5 Wist2Msil; do
            api PATCH "/repos/${OWNER}/${repo}" '{"archived":true}' >/dev/null
          done

          upsert_file \
            'docs/assets/wist-social-preview.png' \
            'docs/assets/wist-social-preview.png' \
            'fix: replace corrupted social preview PNG'

          repo_state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}")"
          topics_state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/topics")"
          jq -e --arg expected "$description" '.description == $expected' <<<"$repo_state" >/dev/null
          jq -e --arg expected "$homepage" '.homepage == $expected' <<<"$repo_state" >/dev/null
          jq -e '.names == ["dotnet","csharp","rule-engine","expression-engine","embedded-dsl","business-rules","compiler","interpreter","cil","runtime","language-tooling","ssa"]' <<<"$topics_state" >/dev/null

          archived='{}'
          for repo in Wist Wist4 Wist5 Wist2Msil; do
            state="$(api GET "/repos/${OWNER}/${repo}")"
            jq -e '.archived == true' <<<"$state" >/dev/null
            archived="$(jq -nc --argjson old "$archived" --arg repo "$repo" '$old + {($repo): true}')"
          done

          png_sha256="$(sha256sum docs/assets/wist-social-preview.png | awk '{print $1}')"
          png_size="$(stat -c '%s' docs/assets/wist-social-preview.png)"
          completed_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          mkdir -p "$(dirname "$RESULT_PATH")"
          jq -n \
            --arg status VERIFIED \
            --arg completed_at "$completed_at" \
            --arg description "$description" \
            --arg homepage "$homepage" \
            --arg png_sha256 "$png_sha256" \
            --argjson png_size "$png_size" \
            --argjson archived "$archived" \
            --argjson topics "$(jq -c '.names' <<<"$topics_state")" \
            '{
              status: $status,
              completed_at: $completed_at,
              repository: "Misha1302/Wist2",
              description: $description,
              homepage: $homepage,
              topics: $topics,
              social_preview_repository_file: {
                path: "docs/assets/wist-social-preview.png",
                width: 1280,
                height: 640,
                size_bytes: $png_size,
                sha256: $png_sha256,
                valid_png: true
              },
              archived_repositories: $archived,
              manual_actions_remaining: [
                "Upload the PNG in Settings -> General -> Social preview",
                "Pin Misha1302/Wist2 in the GitHub profile"
              ]
            }' >"$RESULT_PATH"

          upsert_file \
            "$RESULT_PATH" \
            "$RESULT_PATH" \
            'chore: record Wist repository finalization result'

      - name: Remove temporary automation and trigger PR
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          api() {
            local method="$1"
            local path="$2"
            local data="${3-}"
            local args=(
              -fsS --retry 3 --retry-all-errors
              -X "$method"
              -H "Authorization: Bearer ${ADMIN_TOKEN}"
              -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28'
            )
            if [[ -n "$data" ]]; then
              args+=(-H 'Content-Type: application/json' --data "$data")
            fi
            curl "${args[@]}" "https://api.github.com${path}"
          }

          delete_if_exists() {
            local path="$1"
            local message="$2"
            local state sha payload
            if ! state="$(api GET "/repos/${OWNER}/${ACTIVE_REPO}/contents/${path}?ref=master" 2>/dev/null)"; then
              return 0
            fi
            sha="$(jq -er '.sha' <<<"$state")"
            payload="$(jq -nc --arg message "$message" --arg sha "$sha" --arg branch master \
              '{message: $message, sha: $sha, branch: $branch}')"
            api DELETE "/repos/${OWNER}/${ACTIVE_REPO}/contents/${path}" "$payload" >/dev/null
          }

          delete_if_exists 'trigger-placeholder.txt' 'chore: remove temporary workflow placeholder'
          delete_if_exists '.github/workflows/wist-admin-finalize.yml' 'chore: remove completed Wist finalization workflow'
          delete_if_exists '.github/workflows/wist-admin-finalize-trigger.yml' 'chore: remove completed Wist trigger workflow'
          delete_if_exists '.github/workflows/wist-admin-pr.yml' 'chore: remove completed PR finalization workflow'

          api PATCH "/repos/${OWNER}/${ACTIVE_REPO}/pulls/${PR_NUMBER}" '{"state":"closed"}' >/dev/null
          api DELETE "/repos/${OWNER}/${ACTIVE_REPO}/git/refs/heads/${HEAD_REF}" >/dev/null
