name: CompilationLab S14 Apply v3

on:
  pull_request:
    branches:
      - migration/languageplan-single-runtime-20260807
    paths:
      - ".github/workflows/compilationlab-s14-apply-v3.yml"
      - ".compilationlab/s14-v3.patch.gz.b64"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_BASE_SHA: 1eaefc11e7cfe0c362fd38795768b3b984da9eb5
      TARGET_BRANCH: migration/s14-manifest-activation-cleanup-20260810
      EXPECTED_GZIP_SHA256: 151e87f5f9d7c6e8cf86a6cedd557189ad014bed6fe3b01a827e45ec8ec5b241
      EXPECTED_PATCH_SHA256: e513588ee521f9a56350bcec3a94b3986a1d26ce632e8494c06f52ca7fbf4e53
    steps:
      - name: Checkout helper payload
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: UniversalToolchain/global.json
      - name: Reconstruct and verify exact S14 patch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.event.pull_request.base.sha }}" = "$EXPECTED_BASE_SHA"
          remote_target="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_target" = "$EXPECTED_BASE_SHA"
          base64 --decode .compilationlab/s14-v3.patch.gz.b64 > "$RUNNER_TEMP/s14.patch.gz"
          echo "$EXPECTED_GZIP_SHA256  $RUNNER_TEMP/s14.patch.gz" | sha256sum -c -
          gzip --decompress --stdout "$RUNNER_TEMP/s14.patch.gz" > "$RUNNER_TEMP/s14.patch"
          echo "$EXPECTED_PATCH_SHA256  $RUNNER_TEMP/s14.patch" | sha256sum -c -
      - name: Apply and validate S14 on exact integrated base
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach "$EXPECTED_BASE_SHA"
          git apply --check --binary "$RUNNER_TEMP/s14.patch"
          git apply --index --binary "$RUNNER_TEMP/s14.patch"
          git diff --cached --check
          test ! -d UniversalToolchain/UniversalToolchain.Dialects.ManifestEmitter
          test ! -f UniversalToolchain/Directory.Build.targets
          test -f UniversalToolchain/UniversalToolchain.Dialects.Abstractions/DialectComponentContractAttribute.cs
          grep -q 'class DialectComponentContractAttribute' UniversalToolchain/UniversalToolchain.Dialects.Abstractions/DialectComponentContractAttribute.cs
          ! grep -q 'Directory.Build.targets' UniversalToolchain/UniversalToolchain.Dialects.Tests/TestSourcePaths.cs
          grep -q 'Directory.Build.props' UniversalToolchain/UniversalToolchain.Dialects.Tests/TestSourcePaths.cs
          python3 Tools/check-build-topology.py
          python3 Tools/test-build-topology-mutants.py
          python3 Tools/check-retired-surface.py
          python3 Tools/test-retired-surface-mutants.py
          python3 Tools/check_documentation_status.py
          python3 Tools/test-documentation-status-mutants.py --root .
          python3 Tools/check-wist-documentation-first-contact.py --root . --skip-compile
          python3 - <<'PY'
          import json
          from pathlib import Path
          counts = json.loads(Path('eng/test-counts.json').read_text(encoding='utf-8'))
          assert counts['totalPassed'] == 1276, counts
          dialects = next(x for x in counts['main'] if x['label'] == 'Dialects')
          assert dialects['expectedPassed'] == 253, dialects
          surface = json.loads(Path('eng/wist-package-surface.json').read_text(encoding='utf-8'))
          assert surface['schemaVersion'] == 4, surface
          assert 'runtimeManifests' not in surface
          assert 'runtimeManifestSha256' not in surface
          assert 'System.Reflection.MetadataLoadContext.dll' not in surface['runtimeAssemblies']
          PY
      - name: Canonical Linux build/test before mutation
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh --skip-docs --skip-pack
      - name: Create and push one causal S14 commit
        shell: bash
        run: |
          set -euo pipefail
          remote_target="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$remote_target" = "$EXPECTED_BASE_SHA"
          tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          commit="$(printf '%s\n' 'arch(s14): retire runtime-manifest activation representation' | git commit-tree "$tree" -p "$EXPECTED_BASE_SHA")"
          test "$(git rev-parse "${commit}^")" = "$EXPECTED_BASE_SHA"
          git push origin "${commit}:refs/heads/${TARGET_BRANCH}"
          pushed="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "$pushed" = "$commit"
          echo "S14_COMMIT=$commit"
          echo "S14_TREE=$tree"
