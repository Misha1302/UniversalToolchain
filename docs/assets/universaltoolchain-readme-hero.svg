    <rect x="820" y="391" width="245" height="96" rx="14" fill="none" stroke="#a855f7" stroke-width="3"/>
    <text x="842" y="449" fill="#a855f7" font-size="40" font-style="italic">f(x)</text>
    <text x="920" y="449" fill="#fff" font-size="25">functions</text>
    <rect x="820" y="504" width="245" height="96" rx="14" fill="none" stroke="#f59e0b" stroke-width="3"/>
    <text x="842" y="565" fill="#f59e0b" font-size="56" font-weight="300">+</text>
    <text x="920" y="562" fill="#fff" font-size="25">your feature</text>
  </g>
