    <text x="56" y="374" fill="#4a8df6" font-size="58" font-weight="700">Build languages</text>
    <text x="56" y="450" fill="#4a8df6" font-size="58" font-weight="700">from reusable features.</text>
    <text x="56" y="542" fill="#b9bcc3" font-size="34" font-weight="500">Modular compiler framework for .NET</text>
  </g>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="820" y="165" width="245" height="96" rx="14" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <text x="842" y="224" fill="#3b82f6" font-size="44" font-weight="700">+−</text>
    <text x="842" y="253" fill="#3b82f6" font-size="38" font-weight="700">×÷</text>
    <text x="920" y="225" fill="#fff" font-size="25">arithmetic</text>
    <rect x="820" y="278" width="245" height="96" rx="14" fill="none" stroke="#38c76f" stroke-width="3"/>
    <circle cx="866" cy="302" r="8" fill="none" stroke="#38c76f" stroke-width="3"/>
