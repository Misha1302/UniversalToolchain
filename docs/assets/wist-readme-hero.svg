<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wist for .NET — validate restricted formulas and compile typed delegates</title>
  <desc id="desc">A spacious dark technical banner with Wist branding, a numeric formula, validation status, typed delegate compilation, and a host-owned result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.58" stop-color="#060b20"/>
      <stop offset="1" stop-color="#14062d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09b8f6"/>
      <stop offset="0.52" stop-color="#5365f5"/>
      <stop offset="1" stop-color="#9b35ef"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fbff5"/>
      <stop offset="1" stop-color="#a234ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1d4ed8" opacity="0.24"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#020617" flood-opacity="0.62"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="26" fill="url(#glow)"/>
  <rect x="0" y="430" width="190" height="210" fill="url(#dots)" opacity="0.75"/>

  <!-- Brand and message -->
  <text x="64" y="211" fill="url(#brand)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="146" font-weight="800" letter-spacing="-6">Wist</text>
  <text x="70" y="331" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="105" font-weight="760" letter-spacing="-3">for .NET</text>
  <text x="72" y="398" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25" font-weight="500">Validate restricted formulas.</text>
  <text x="72" y="438" fill="#e2e8f0" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="500">Compile approved rules to typed delegates.</text>

  <!-- Main panel -->
  <g filter="url(#softShadow)">
    <rect x="570" y="115" width="650" height="360" rx="22" fill="#050d20" stroke="url(#edge)" stroke-width="1.5"/>
  </g>
  <rect x="594" y="147" width="602" height="64" rx="12" fill="#071126" stroke="#293858"/>
  <text x="617" y="188" fill="#f1f5f9" font-family="JetBrains Mono, Consolas, monospace" font-size="20">usage <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">0.7</tspan> <tspan fill="#8b5cf6">+</tspan> reliability <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">0.3</tspan> <tspan fill="#fb3569">-</tspan> incidents <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">15.0</tspan></text>

  <line x1="594" y1="300" x2="1196" y2="300" stroke="#24324c"/>
  <line x1="594" y1="377" x2="1196" y2="377" stroke="#24324c"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23">
    <circle cx="617" cy="262" r="18" fill="#06251e" stroke="#12d66c" stroke-width="2"/>
    <path d="M608 262l7 7 12-15" fill="none" stroke="#19e57a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="657" y="270" fill="#f8fafc">Validated before execution</text>

    <circle cx="617" cy="338" r="18" fill="#06251e" stroke="#12d66c" stroke-width="2"/>
    <path d="M608 338l7 7 12-15" fill="none" stroke="#19e57a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="657" y="346" fill="#f8fafc">Compiled to</text>
    <text x="798" y="346" fill="#22d3ee" font-family="JetBrains Mono, Consolas, monospace" font-size="18">Func&lt;double, double, double, double&gt;</text>

    <circle cx="617" cy="416" r="18" fill="#06251e" stroke="#12d66c" stroke-width="2"/>
    <path d="M608 416l7 7 12-15" fill="none" stroke="#19e57a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="657" y="424" fill="#f8fafc">Result:</text>
    <text x="750" y="424" fill="#22d3ee" font-family="JetBrains Mono, Consolas, monospace" font-size="22">82.0</text>
  </g>

  <!-- Footer -->
  <g transform="translate(490,548)">
    <path d="M26 0l22 9v18c0 16-9 28-22 35C13 55 4 43 4 27V9z" fill="none" stroke="#6955f7" stroke-width="3"/>
    <path d="M17 29l7 7 12-15" fill="none" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="40" fill="#d7dce5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500">Host decides the action</text>
  </g>
</svg>
