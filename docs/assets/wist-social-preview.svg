<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wist for .NET — restricted formulas to typed delegates</title>
  <desc id="desc">A compact social preview showing the Wist brand, a restricted formula, validation, compilation, and a numeric result.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.62" stop-color="#060b20"/>
      <stop offset="1" stop-color="#150630"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#09b8f6"/>
      <stop offset="0.52" stop-color="#5365f5"/>
      <stop offset="1" stop-color="#9b35ef"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0fbff5"/>
      <stop offset="1" stop-color="#a234ef"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.87" cy="0.05" r="0.75">
      <stop offset="0" stop-color="#6d28d9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" rx="26" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="26" fill="url(#glow)"/>

  <text x="93" y="202" fill="url(#brand)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="125" font-weight="800" letter-spacing="-5">Wist</text>
  <text x="508" y="202" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="116" font-weight="760" letter-spacing="-4">for .NET</text>
  <text x="325" y="272" fill="#d7dce5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="33" font-weight="500">Restricted formulas <tspan fill="#7667f7">→</tspan> typed delegates</text>

  <rect x="90" y="322" width="1100" height="82" rx="14" fill="#050d20" stroke="url(#edge)" stroke-width="1.3"/>
  <text x="145" y="374" fill="#f1f5f9" font-family="JetBrains Mono, Consolas, monospace" font-size="29">usage <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">0.7</tspan> <tspan fill="#8b5cf6">+</tspan> reliability <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">0.3</tspan> <tspan fill="#fb3569">-</tspan> incidents <tspan fill="#8b5cf6">*</tspan> <tspan fill="#22d3ee">15.0</tspan></text>

  <rect x="90" y="430" width="1100" height="92" rx="14" fill="#050d20" stroke="#273755"/>
  <line x1="455" y1="447" x2="455" y2="505" stroke="#334155"/>
  <line x1="825" y1="447" x2="825" y2="505" stroke="#334155"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="500">
    <circle cx="174" cy="476" r="22" fill="#06251e" stroke="#12d66c" stroke-width="2.5"/>
    <path d="M163 476l8 8 15-18" fill="none" stroke="#19e57a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="218" y="486" fill="#f8fafc">Validated</text>

    <circle cx="543" cy="476" r="22" fill="#06251e" stroke="#12d66c" stroke-width="2.5"/>
    <path d="M532 476l8 8 15-18" fill="none" stroke="#19e57a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="587" y="486" fill="#f8fafc">Compiled</text>

    <circle cx="908" cy="476" r="22" fill="#06251e" stroke="#12d66c" stroke-width="2.5"/>
    <path d="M897 476l8 8 15-18" fill="none" stroke="#19e57a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="952" y="486" fill="#f8fafc">Result:</text>
    <text x="1053" y="486" fill="#22d3ee" font-family="JetBrains Mono, Consolas, monospace" font-size="28">82.0</text>
  </g>

  <g transform="translate(430,558)">
    <path d="M22 0l19 8v16c0 14-8 24-19 30C11 48 3 38 3 24V8z" fill="none" stroke="#6955f7" stroke-width="2.6"/>
    <path d="M14 25l6 6 11-14" fill="none" stroke="#8b5cf6" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="58" y="35" fill="#d7dce5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="25">Host decides the action</text>
  </g>
</svg>
