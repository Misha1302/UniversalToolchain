<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wist for .NET — restricted formulas compiled to typed delegates</title>
  <desc id="desc">A polished technical banner showing a restricted numeric formula validated before execution, compiled to a typed .NET delegate, and returned to a host-owned application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06101f"/>
      <stop offset="0.52" stop-color="#091426"/>
      <stop offset="1" stop-color="#11112d"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1b31" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#081322" stop-opacity="0.98"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.1" r="0.75">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.9" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#000814" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="30" fill="url(#bg)"/>
  <rect width="1280" height="640" rx="30" fill="url(#glowA)"/>
  <rect width="1280" height="640" rx="30" fill="url(#glowB)"/>
  <rect width="1280" height="640" rx="30" fill="url(#grid)"/>
  <rect x="1" y="1" width="1278" height="638" rx="29" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <text x="56" y="94" fill="url(#brand)" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-2">Wist</text>
  <text x="214" y="94" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="62" font-weight="750" letter-spacing="-2">for .NET</text>
  <text x="57" y="132" fill="#b8c6db" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="500">Restricted formulas → validated → typed delegates</text>

  <g transform="translate(807,54)">
    <rect width="417" height="45" rx="22.5" fill="#0b1729" stroke="#334c70"/>
    <circle cx="24" cy="22.5" r="7" fill="#34d399"/>
    <text x="43" y="29" fill="#dbeafe" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">UniversalToolchain.Wist · public alpha</text>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="0.4">
    <g transform="translate(56,153)">
      <rect width="153" height="38" rx="19" fill="#0b1b31" stroke="#27568a"/>
      <circle cx="19" cy="19" r="10" fill="#0b4c7a"/>
      <path d="M15 14l8 5-8 5z" fill="#7dd3fc"/>
      <text x="37" y="24" fill="#dbeafe">FORMULA</text>
    </g>
    <path d="M218 172h38" stroke="#52647e" stroke-width="2"/><path d="M250 166l8 6-8 6" fill="none" stroke="#52647e" stroke-width="2"/>
    <g transform="translate(268,153)">
      <rect width="153" height="38" rx="19" fill="#171431" stroke="#5b4db4"/>
      <circle cx="19" cy="19" r="10" fill="#4338ca"/>
      <path d="M14 19l4 4 7-9" fill="none" stroke="#c4b5fd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="37" y="24" fill="#ede9fe">VALIDATE</text>
    </g>
    <path d="M430 172h38" stroke="#52647e" stroke-width="2"/><path d="M462 166l8 6-8 6" fill="none" stroke="#52647e" stroke-width="2"/>
    <g transform="translate(480,153)">
      <rect width="153" height="38" rx="19" fill="#111b37" stroke="#3d5eca"/>
      <circle cx="19" cy="19" r="10" fill="#2546a7"/>
      <text x="13" y="24" fill="#bfdbfe" font-family="JetBrains Mono, Consolas, monospace" font-size="14">{ }</text>
      <text x="37" y="24" fill="#dbeafe">COMPILE</text>
    </g>
    <path d="M642 172h38" stroke="#52647e" stroke-width="2"/><path d="M674 166l8 6-8 6" fill="none" stroke="#52647e" stroke-width="2"/>
    <g transform="translate(692,153)">
      <rect width="208" height="38" rx="19" fill="#0c2230" stroke="#187b6f"/>
      <circle cx="19" cy="19" r="10" fill="#047857"/>
      <path d="M14 19h10M20 15l4 4-4 4" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="37" y="24" fill="#d1fae5">TYPED DELEGATE</text>
    </g>
    <path d="M909 172h38" stroke="#52647e" stroke-width="2"/><path d="M941 166l8 6-8 6" fill="none" stroke="#52647e" stroke-width="2"/>
    <g transform="translate(959,153)">
      <rect width="265" height="38" rx="19" fill="#192117" stroke="#52743a"/>
      <circle cx="19" cy="19" r="10" fill="#3f6212"/>
      <circle cx="19" cy="19" r="4" fill="#d9f99d"/>
      <text x="37" y="24" fill="#ecfccb">HOST DECIDES THE ACTION</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="56" y="216" width="1168" height="342" rx="24" fill="url(#panel)" stroke="#29415f" stroke-width="1.5"/>
  </g>

  <text x="88" y="267" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="27" font-weight="750">A narrow formula surface</text>
  <text x="88" y="299" fill="#91a4bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">for configurable numeric logic —</text>
  <text x="88" y="324" fill="#91a4bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">without exposing broad scripting.</text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
    <circle cx="101" cy="374" r="12" fill="#0c3b31" stroke="#10b981"/><path d="M95 374l4 4 8-9" fill="none" stroke="#6ee7b7" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="380" fill="#d7e2ef">Validate without executing</text>
    <circle cx="101" cy="420" r="12" fill="#112f4b" stroke="#38bdf8"/><path d="M95 420h12M103 416l4 4-4 4" fill="none" stroke="#7dd3fc" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="126" y="426" fill="#d7e2ef">Compile once, invoke many</text>
    <circle cx="101" cy="466" r="12" fill="#2d2350" stroke="#8b5cf6"/><text x="93" y="472" fill="#ddd6fe" font-family="JetBrains Mono, Consolas, monospace" font-size="15" font-weight="700">T</text>
    <text x="126" y="472" fill="#d7e2ef">Typed .NET delegate output</text>
  </g>

  <rect x="88" y="506" width="314" height="34" rx="17" fill="#101a2d" stroke="#2d4566"/>
  <text x="105" y="528" fill="#9fb3cc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600">Host owns inputs, isolation and side effects</text>
  <path d="M433 246v282" stroke="#2b3f59" stroke-width="1"/>

  <rect x="465" y="246" width="725" height="280" rx="17" fill="#07111f" stroke="#2d4665"/>
  <rect x="465" y="246" width="725" height="50" rx="17" fill="#0d1a2c"/>
  <rect x="465" y="279" width="725" height="17" fill="#0d1a2c"/>
  <rect x="487" y="260" width="28" height="24" rx="6" fill="#0b3a62" stroke="#2b78b8"/>
  <text x="493" y="278" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700">ƒx</text>
  <text x="528" y="279" fill="#e5edf7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17" font-weight="650">Restricted formula</text>
  <rect x="1003" y="258" width="165" height="27" rx="13.5" fill="#10223b" stroke="#365677"/>
  <text x="1021" y="277" fill="#7dd3fc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600">numeric expression only</text>

  <rect x="483" y="312" width="689" height="61" rx="11" fill="#0b1728" stroke="#233a55"/>
  <text x="499" y="349" fill="#64748b" font-family="JetBrains Mono, Consolas, monospace" font-size="18">1</text>
  <path d="M530 313v59" stroke="#273c57"/>
  <text x="553" y="349" fill="#dbe7f4" font-family="JetBrains Mono, Consolas, monospace" font-size="20">usage <tspan fill="#38bdf8">* 0.7 +</tspan> reliability <tspan fill="#38bdf8">* 0.3</tspan> <tspan fill="#fb7185">-</tspan> incidents <tspan fill="#38bdf8">* 15.0</tspan></text>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-size="17">
    <g transform="translate(489,392)">
      <rect width="679" height="38" rx="9" fill="#0b1d20" stroke="#1c4b43"/>
      <circle cx="20" cy="19" r="10" fill="#0e3a31" stroke="#10b981"/><path d="M15 19l4 4 7-9" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="43" y="25" fill="#86efac" font-weight="650">Validated before execution</text>
    </g>
    <g transform="translate(489,438)">
      <rect width="679" height="38" rx="9" fill="#0b1d20" stroke="#1c4b43"/>
      <circle cx="20" cy="19" r="10" fill="#0e3a31" stroke="#10b981"/><path d="M15 19l4 4 7-9" fill="none" stroke="#6ee7b7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="43" y="25" fill="#86efac" font-weight="650">Compiled to</text>
      <text x="147" y="25" fill="#7dd3fc" font-family="JetBrains Mono, Consolas, monospace" font-size="15">Func&lt;double, double, double, double&gt;</text>
    </g>
    <g transform="translate(489,484)">
      <rect width="326" height="30" rx="8" fill="#0b1d20" stroke="#1c4b43"/>
      <circle cx="18" cy="15" r="8" fill="#0e3a31" stroke="#10b981"/><path d="M14 15l3 3 6-7" fill="none" stroke="#6ee7b7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="36" y="21" fill="#86efac" font-size="15" font-weight="650">Score: 82.0</text>
    </g>
    <g transform="translate(827,484)">
      <rect width="341" height="30" rx="8" fill="#271516" stroke="#743436"/>
      <circle cx="18" cy="15" r="8" fill="#3a191c" stroke="#fb7185"/><path d="M14 11l8 8M22 11l-8 8" stroke="#fda4af" stroke-width="1.8" stroke-linecap="round"/>
      <text x="36" y="21" fill="#fda4af" font-size="15" font-weight="650">Statement-style rule rejected</text>
    </g>
  </g>

  <circle cx="62" cy="600" r="6" fill="#f59e0b"/>
  <text x="78" y="606" fill="#9aa9bd" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Language-surface restriction, not a hardened sandbox.</text>
  <text x="1224" y="606" text-anchor="end" fill="#73849a" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15">Validate → compile → return data</text>
</svg>
