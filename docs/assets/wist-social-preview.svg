<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Wist restricted formulas for .NET</title>
  <desc id="desc">A formula is validated, compiled into a typed delegate, and invoked by a .NET application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="34" fill="url(#bg)"/>
  <circle cx="1130" cy="80" r="170" fill="#7c3aed" opacity="0.15"/>
  <circle cx="116" cy="590" r="220" fill="#2563eb" opacity="0.12"/>

  <text x="72" y="104" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="66" font-weight="700">Wist for .NET</text>
  <text x="74" y="153" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="28">Restricted formulas → validated → typed delegates</text>

  <g filter="url(#shadow)">
    <rect x="72" y="207" width="1136" height="278" rx="24" fill="#0b1020" stroke="#334155" stroke-width="2"/>
    <circle cx="106" cy="239" r="7" fill="#fb7185"/>
    <circle cx="132" cy="239" r="7" fill="#fbbf24"/>
    <circle cx="158" cy="239" r="7" fill="#4ade80"/>
    <text x="102" y="301" fill="#93c5fd" font-family="JetBrains Mono, Consolas, monospace" font-size="27">usage * 0.7 + reliability * 0.3 - incidents * 15</text>
    <text x="102" y="363" fill="#4ade80" font-family="JetBrains Mono, Consolas, monospace" font-size="25">VALIDATED before execution</text>
    <text x="102" y="407" fill="#4ade80" font-family="JetBrains Mono, Consolas, monospace" font-size="25">COMPILED once to Func&lt;double, double, double, double&gt;</text>
    <text x="102" y="451" fill="#fbbf24" font-family="JetBrains Mono, Consolas, monospace" font-size="25">score = 82.0  |  host application decides the action</text>
  </g>

  <rect x="72" y="530" width="410" height="58" rx="29" fill="#312e81" stroke="#818cf8"/>
  <text x="101" y="568" fill="#e0e7ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">UniversalToolchain.Wist on NuGet</text>
  <text x="1208" y="570" text-anchor="end" fill="#94a3b8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22">Host-owned inputs and side effects</text>
</svg>
